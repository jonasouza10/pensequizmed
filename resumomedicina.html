{t:"Adaptações Celulares e Lesão Celular",s:"Quando uma célula sofre algum tipo de estresse (aumento de demanda, falta de nutrientes, estímulo hormonal etc.), ela pode se adaptar de quatro formas principais:<br><br>• <strong>Hipertrofia:</strong> aumento do tamanho da célula (e portanto do órgão). Exemplo clássico: aumento do músculo cardíaco na hipertensão arterial.<br>• <strong>Hiperplasia:</strong> aumento do número de células. Exemplo: crescimento da mama na gravidez ou hiperplasia da próstata.<br>• <strong>Atrofia:</strong> diminuição do tamanho e da função da célula. Pode ocorrer por desuso, falta de inervação, isquemia crônica, envelhecimento ou falta de estímulo hormonal.<br>• <strong>Metaplasia:</strong> substituição de um tipo de célula adulta por outro tipo de célula adulta mais resistente àquele estresse. Exemplo clássico: epitélio respiratório de fumantes vira epitélio escamoso.<br><br>Se o estresse for intenso demais ou durar tempo demais, a célula sofre <strong>lesão</strong>. A lesão pode ser reversível (a célula volta ao normal quando o agressão cessa) ou irreversível (a célula morre por necrose ou por apoptose). Os mecanismos principais de lesão celular incluem depleção de ATP, dano mitocondrial, entrada excessiva de cálcio, estresse oxidativo (radicais livres) e danos diretos às membranas e ao DNA.<br><div class='hy'><strong>Provas:</strong> A metaplasia escamosa dos brônquios em fumantes e o esôfago de Barrett (metaplasia intestinal do esôfago) são exemplos clássicos e têm potencial de evoluir para câncer. A hipertrofia cardíaca patológica ocorre na hipertensão e em valvopatias. A necrose de coagulação é o padrão típico do infarto em órgãos sólidos como coração e rim.</div>"},
{t:"Morte Celular: Necrose e Apoptose",s:"Existem duas formas principais de morte celular, com significados biológicos muito diferentes.<br><br><strong>Necrose</strong> é a morte celular “desordenada” e patológica. A membrana plasmática se rompe, o conteúdo da célula vaza para o interstício e isso provoca inflamação. Os principais padrões morfológicos de necrose são: coagulação (típica de infartos isquêmicos em órgãos sólidos), liquefação (típica do sistema nervoso central e de abscessos), caseosa (típica da tuberculose – tem aspecto de queijo branco), gordurosa (típica de pancreatite) e fibrinoide (vista em algumas vasculites e na hipertensão maligna).<br><br><strong>Apoptose</strong> é a morte celular programada e ordenada. A célula encolhe, a cromatina se condensa, formam-se corpos apoptóticos e esses corpos são rapidamente fagocitados por células vizinhas ou macrófagos, sem gerar inflamação significativa. A apoptose pode ser ativada por uma via intrínseca (mitocondrial – envolvendo proteínas da família Bcl-2, liberação de citocromo c e formação do apoptossomo) ou por uma via extrínseca (receptores de morte na membrana, como Fas e receptores de TNF). As caspases são as proteases que executam o programa de morte.<br><div class='hy'><strong>Provas:</strong> A necrose caseosa é considerada altamente sugestiva de tuberculose até prova em contrário. A falha dos mecanismos de apoptose contribui para o desenvolvimento de câncer e de doenças autoimunes. O excesso de apoptose está envolvido em doenças neurodegenerativas e na lesão por isquemia e reperfusão.</div>"},
{t:"Inflamação Aguda e Crônica",s:"A inflamação é a resposta do tecido vascularizado a uma agressão. Seu objetivo é eliminar o agente agressor e iniciar o reparo.<br><br>Na <strong>inflamação aguda</strong> a resposta é rápida e os neutrófilos predominam. Os sinais cardinais clássicos descritos por Celsus são: rubor (vermelhidão), calor, tumor (inchaço) e dor. Depois se acrescentou a perda de função. Há aumento do fluxo sanguíneo, aumento da permeabilidade vascular (com saída de proteínas e líquido para o interstício) e migração de leucócitos (principalmente neutrófilos) para o foco inflamatório. Os mediadores químicos envolvidos incluem histamina, bradicinina, prostaglandinas, leucotrienos, citocinas (IL-1, TNF, IL-6), quimiocinas e componentes do complemento.<br><br>Na <strong>inflamação crônica</strong> o processo se prolonga por semanas, meses ou anos. Predominam linfócitos, macrófagos e plasmócitos. Pode haver formação de tecido de granulação e fibrose. Em algumas situações forma-se um granuloma (agregado de macrófagos modificados, chamados de células epitelioides, muitas vezes com células gigantes multinucleadas). Granulomas são típicos de tuberculose, sarcoidose, algumas micoses e reações a corpos estranhos.<br><div class='hy'><strong>Provas:</strong> Granuloma com necrose caseosa é considerado tuberculose até prova em contrário. Os AINEs inibem a ciclo-oxigenase (COX) e diminuem a produção de prostaglandinas, por isso têm efeito analgésico, anti-inflamatório e antipirético. Os neutrófilos predominam nas primeiras 24 a 48 horas; depois o predomínio passa para os macrófagos. A proteína C reativa (PCR) e a velocidade de hemossedimentação (VHS) são marcadores laboratoriais de inflamação sistêmica.</div>"},
{t:"Reparo Tecidual e Cicatrização",s:"Depois da inflamação vem o reparo. O reparo pode ocorrer por <strong>regeneração</strong> (as células originais são substituídas por células do mesmo tipo, recuperando a arquitetura e a função) ou por <strong>cicatrização/fibrose</strong> (há depósito de colágeno e formação de uma cicatriz, com perda parcial da arquitetura original).<br><br>Tecidos lábeis (que se dividem continuamente, como epitélios e medula óssea) e tecidos estáveis (que normalmente se dividem pouco, mas podem se dividir quando necessário, como fígado e rim) têm boa capacidade de regeneração, desde que a matriz extracelular esteja preservada. Tecidos permanentes (neurônios, miócitos cardíacos e, em grande parte, músculo esquelético adulto) têm capacidade regenerativa muito limitada ou nula – a lesão nesses tecidos resulta quase sempre em cicatriz.<br><br>A cicatrização de uma ferida passa por várias fases: coagulação e formação do coágulo, inflamação, formação de tecido de granulação (fibroblastos + novos vasos sanguíneos), deposição de colágeno e, por fim, remodelação da cicatriz. A cicatrização pode ser por primeira intenção (bordas da ferida aproximadas, cicatriz linear fina) ou por segunda intenção (perda maior de tecido, ferida aberta, mais contração e cicatriz mais larga).<br><div class='hy'><strong>Provas:</strong> A vitamina C e o zinco são importantes para a síntese adequada de colágeno e, portanto, para a cicatrização. Diabetes, uso de corticoides, infecção local e má perfusão sanguínea prejudicam o reparo. Queloide e cicatriz hipertrófica são exemplos de cicatrização excessiva. O fígado tem grande capacidade regenerativa, desde que a arquitetura lobular esteja preservada.</div>"},
{t:"Distúrbios Hemodinâmicos, Trombose e Choque",s:"Este capítulo da patologia geral inclui edema, hiperemia, congestão, hemorragia, trombose, embolia, infarto e choque.<br><br>A <strong>tríade de Virchow</strong> explica os fatores que predispõem à trombose: (1) lesão do endotélio, (2) estase ou turbulência do fluxo sanguíneo e (3) hipercoagulabilidade do sangue. Um trombo pode evoluir de várias formas: crescer (propagação), fragmentar-se e embolizar, ser dissolvido pela fibrinolise ou ser organizado e recanalizado.<br><br>O <strong>infarto</strong> é uma área de necrose isquêmica. Pode ser branco (anêmico) – típico de órgãos sólidos com circulação terminal, como baço, rim e coração – ou vermelho (hemorrágico) – típico de órgãos com dupla circulação ou tecido frouxo, como pulmão e intestino.<br><br><strong>Choque</strong> é a situação de hipoperfusão tecidual generalizada, com oferta de oxigênio insuficiente para as necessidades das células. Os principais tipos são: hipovolêmico (perda de volume), cardiogênico (falha da bomba cardíaca), distributivo (vasodilatação e má distribuição do fluxo – inclui o choque séptico, o anafilático e o neurogênico) e obstrutivo (obstrução mecânica ao fluxo, como no tamponamento cardíaco ou no tromboembolismo pulmonar maciço).<br><div class='hy'><strong>Provas:</strong> A trombose venosa profunda dos membros inferiores é uma causa importante de embolia pulmonar. A tríade de Virchow é clássica em provas. O choque séptico é um tipo de choque distributivo. A coagulação intravascular disseminada (CID) cursa com formação difusa de trombos e consumo de plaquetas e fatores de coagulação, levando a sangramentos.</div>"},
{t:"Neoplasia – Conceitos, Carcinogênese e Hallmarks",s:"Neoplasia significa “crescimento novo”. É uma proliferação clonal, excessiva e descontrolada de células. As neoplasias se dividem em benignas e malignas.<br><br><strong>Benignas:</strong> em geral bem diferenciadas (parecem o tecido de origem), crescem de forma expansiva, costumam ser encapsuladas e não invadem nem metastatizam. O nome geralmente termina em “-oma” (com algumas exceções importantes: linfoma, melanoma, seminoma e hepatoma são malignos).<br><br><strong>Malignas:</strong> invadem os tecidos vizinhos e têm capacidade de metastatizar (espalhar-se para órgãos distantes). O grau de diferenciação varia: podem ser bem diferenciadas ou pouco diferenciadas/anaplásicas. Carcinomas são tumores malignos de origem epitelial; sarcomas são de origem mesenquimal (tecido conjuntivo, músculo, osso etc.).<br><br>A carcinogênese é um processo de múltiplas etapas (iniciação, promoção e progressão). Os “hallmarks” (características marcantes) do câncer, descritos por Hanahan e Weinberg, incluem: autossuficiência em sinais de crescimento, insensibilidade a sinais inibidores de crescimento, capacidade de evitar a apoptose, potencial replicativo ilimitado (imortalidade – ativação da telomerase), capacidade de induzir angiogênese, capacidade de invadir e metastatizar, reprogramação do metabolismo energético e capacidade de evasão do sistema imune. Por trás de tudo isso costuma haver instabilidade genômica e inflamação promotora de tumor.<br><div class='hy'><strong>Provas:</strong> A metástase é a principal causa de morte por câncer e o critério mais confiável para classificar um tumor como maligno. Proto-oncogenes se transformam em oncogenes por mutações de ganho de função. Genes supressores de tumor (como TP53 e RB) precisam perder a função dos dois alelos para contribuir para o câncer. A displasia é uma alteração pré-maligna caracterizada por atipias celulares e desorganização arquitetural.</div>"}
]},

{t:"Aminoácidos e Proteínas",s:"As proteínas são polímeros de aminoácidos. Existem 20 aminoácidos padrão codificados pelo código genético. Eles se unem uns aos outros por ligações peptídicas (um tipo de ligação amida). A sequência linear dos aminoácidos constitui a <strong>estrutura primária</strong> da proteína. A partir dessa sequência a cadeia se organiza em estruturas locais estáveis – principalmente α-hélices e folhas-β – que formam a <strong>estrutura secundária</strong> (mantida por pontes de hidrogênio). O dobramento tridimensional completo da cadeia é a <strong>estrutura terciária</strong>. Quando várias cadeias polipeptídicas se associam, fala-se em <strong>estrutura quaternária</strong> (exemplo clássico: a hemoglobina, formada por quatro cadeias).<br><br>A <strong>desnaturação</strong> é a perda da estrutura tridimensional nativa (e portanto da função biológica) sem que as ligações peptídicas sejam quebradas. Pode ser causada por calor, pH extremo, solventes orgânicos ou agentes que quebram pontes dissulfeto. Em muitos casos a desnaturação é irreversível.<br><div class='hy'><strong>Provas:</strong> A anemia falciforme é causada por uma única troca de aminoácido (ácido glutâmico por valina) na posição 6 da cadeia beta da hemoglobina. Os príons são proteínas mal dobradas capazes de induzir o mal dobramento de outras proteínas da mesma espécie. O colágeno depende da vitamina C para a hidroxilação de resíduos de prolina e lisina; a deficiência causa escorbuto.</div>"},
{t:"Enzimas e Cinética Enzimática",s:"As enzimas são catalisadores biológicos extremamente eficientes e específicos. Elas aceleram as reações químicas baixando a energia de ativação, mas não são consumidas no processo. A relação entre a velocidade da reação e a concentração de substrato é descrita pelo modelo de Michaelis-Menten. O parâmetro <strong>Km</strong> é a concentração de substrato na qual a velocidade atinge metade da velocidade máxima (Vmax). Um Km baixo indica alta afinidade da enzima pelo substrato. A <strong>Vmax</strong> é a velocidade máxima atingida quando a enzima está completamente saturada de substrato.<br><br>A inibição enzimática pode ser:<br>• <strong>Competitiva:</strong> o inibidor compete com o substrato pelo sítio ativo. Aumenta o Km aparente, mas não altera a Vmax (pode ser superada aumentando-se a concentração de substrato).<br>• <strong>Não competitiva:</strong> o inibidor se liga a um local diferente do sítio ativo. Diminui a Vmax e não altera o Km.<br><br>Além da inibição por fármacos ou toxinas, as enzimas são reguladas fisiologicamente por efeitos alostéricos, modificações covalentes (principalmente fosforilação), controle da quantidade de enzima sintetizada e compartimentalização dentro da célula.<br><div class='hy'><strong>Provas:</strong> Muitos medicamentos importantes são inibidores enzimáticos: estatinas (inibem a HMG-CoA redutase), IECA (inibem a enzima conversora de angiotensina), AINEs (inibem a ciclo-oxigenase), alopurinol (inibe a xantina oxidase). Isoenzimas (como CK-MB e as isoformas de LDH) têm grande valor diagnóstico em infarto agudo do miocárdio e outras lesões teciduais.</div>"},
{t:"Glicólise e Metabolismo de Carboidratos",s:"A glicólise é a via central do metabolismo dos carboidratos. Ocorre no citosol e não depende diretamente de oxigênio. Em resumo, uma molécula de glicose é convertida em duas moléculas de piruvato, com saldo líquido de 2 ATP e 2 NADH. Em condições anaeróbicas o piruvato é reduzido a lactato, regenerando o NAD⁺ necessário para a glicólise continuar. Em condições aeróbicas o piruvato entra na mitocôndria e é oxidado no Ciclo de Krebs.<br><br>As enzimas que controlam a velocidade da glicólise são a hexoquinase (ou glicoquinase no fígado), a fosfofrutoquinase-1 (PFK-1 – principal ponto de regulação) e a piruvato quinase. No fígado a frutose-2,6-bisfosfato é um ativador importantíssimo da PFK-1 e permite que a via responda aos níveis de insulina e glucagon.<br><br>A via das pentoses-fosfato (também no citosol) tem duas funções principais: gerar NADPH (essencial para biossínteses redutoras e para a defesa antioxidante) e produzir ribose-5-fosfato (necessária para a síntese de nucleotídeos).<br><div class='hy'><strong>Provas:</strong> A deficiência de glicose-6-fosfato desidrogenase (G6PD), primeira enzima da via das pentoses, causa hemólise quando a pessoa é exposta a oxidantes (primaquina, certas sulfas, infecções ou ingestão de fava). A glicoquinase do fígado tem Km alto e não é inibida pelo seu produto, o que permite que o fígado só capte glicose quando ela está abundante. As doenças de armazenamento de glicogênio (von Gierke, McArdle, Pompe etc.) são clássicas em provas.</div>"},
{t:"Ciclo de Krebs e Fosforilação Oxidativa",s:"O <strong>Ciclo de Krebs</strong> (também conhecido como Ciclo do Ácido Cítrico ou Ciclo dos Ácidos Tricarboxílicos) é uma das vias centrais do metabolismo energético. Ele ocorre na <strong>matriz mitocondrial</strong> e representa a etapa final comum da oxidação de carboidratos, gorduras e de vários aminoácidos.<br><br><strong>Como o ciclo funciona, passo a passo:</strong><br>1. O Acetil-CoA (com 2 carbonos) se condensa com o oxaloacetato (4 carbonos) formando citrato (6 carbonos). A enzima responsável é a citrato sintase.<br>2. O citrato é isomerizado a isocitrato.<br>3. O isocitrato sofre descarboxilação oxidativa e forma α-cetoglutarato (5 carbonos), gerando 1 NADH e 1 CO₂.<br>4. O α-cetoglutarato também sofre descarboxilação oxidativa e forma succinil-CoA (4 carbonos), gerando mais 1 NADH e 1 CO₂.<br>5. O succinil-CoA é convertido em succinato, com formação de 1 GTP (ou ATP) por fosforilação em nível de substrato.<br>6. O succinato é oxidado a fumarato, gerando 1 FADH₂ (essa reação é catalisada pelo Complexo II da cadeia respiratória).<br>7. O fumarato é hidratado a malato.<br>8. O malato é oxidado a oxaloacetato, gerando mais 1 NADH. O oxaloacetato está pronto para recomeçar o ciclo.<br><br><strong>Saldo por volta do ciclo (por Acetil-CoA):</strong> 3 NADH + 1 FADH₂ + 1 GTP + 2 CO₂.<br><br><strong>Fosforilação oxidativa:</strong><br>Os NADH e FADH₂ gerados no ciclo (e também na glicólise e na descarboxilação do piruvato) doam seus elétrons para a cadeia transportadora de elétrons, localizada na membrana interna da mitocôndria. Os elétrons fluem do Complexo I (ou II) → ubiquinona → Complexo III → citocromo c → Complexo IV → oxigênio. A energia liberada nesse fluxo é usada para bombear prótons da matriz para o espaço intermembranar, criando um gradiente eletroquímico (força próton-motriz). A ATP-sintase (Complexo V) permite que os prótons retornem à matriz e aproveita essa energia para sintetizar ATP a partir de ADP e fosfato inorgânico. Esse mecanismo é chamado de quimiosmose (hipótese de Peter Mitchell). O oxigênio é o aceptor final dos elétrons e é reduzido a água.<br><br>Rendimento aproximado: cada NADH mitocondrial rende cerca de 2,5 ATP e cada FADH₂ rende cerca de 1,5 ATP.<br><div class='hy'><strong>Provas clássicas de alto rendimento:</strong><br>• Rotenona bloqueia o Complexo I<br>• Antimicina A bloqueia o Complexo III<br>• Cianeto, monóxido de carbono e azida bloqueiam o Complexo IV (citocromo oxidase)<br>• Oligomicina inibe a ATP-sintase<br>• Desacopladores (DNP, termogenina) dissipam o gradiente de prótons como calor<br>• O Complexo II não bombeia prótons<br>• Doenças mitocondriais afetam preferencialmente tecidos de alto consumo energético</div>"},
{t:"Lipídeos, β-Oxidação e Corpos Cetônicos",s:"Os lipídios desempenham várias funções: reserva energética (triglicerídeos), componentes estruturais de membranas (fosfolipídios e colesterol), precursores de hormônios esteroides e de ácidos biliares (colesterol) e mediadores da inflamação (eicosanoides derivados de ácidos graxos poli-insaturados).<br><br>A <strong>β-oxidação</strong> é a via de degradação dos ácidos graxos. Ocorre dentro da mitocôndria. O ácido graxo é primeiro ativado a acil-CoA e depois transportado para a matriz com ajuda da carnitina (os de cadeia muito longa são oxidados inicialmente nos peroxissomos). Em cada “volta” da β-oxidação são removidos dois carbonos na forma de Acetil-CoA e são gerados 1 NADH e 1 FADH₂.<br><br>Quando a produção de Acetil-CoA ultrapassa a capacidade do Ciclo de Krebs (jejum prolongado ou diabetes descompensado), o fígado converte o excesso de Acetil-CoA em <strong>corpos cetônicos</strong> (acetoacetato, β-hidroxibutirato e acetona). Os corpos cetônicos podem ser usados como combustível pelo cérebro, pelo coração e pelos músculos esqueléticos.<br><div class='hy'><strong>Provas:</strong> A cetoacidose diabética é típica do diabetes mellitus tipo 1 descompensado. As estatinas inibem a HMG-CoA redutase, enzima-chave da síntese de colesterol. Defeitos no transporte pela carnitina ou nas enzimas da β-oxidação causam hipoglicemia hipocetótica e miopatia/cardiomiopatia.</div>"},
{t:"Nucleotídeos, Ácidos Nucleicos e Expressão Gênica",s:"Os nucleotídeos são os blocos de construção do DNA e do RNA. O DNA é uma dupla hélice antiparalela na qual a adenina emparelha com a timina e a citosina emparelha com a guanina. O RNA é geralmente fita simples e usa uracila no lugar da timina. A replicação do DNA é semiconservativa: cada fita antiga serve de molde para uma fita nova.<br><br>A expressão da informação genética envolve a transcrição (síntese de RNA a partir do DNA) e a tradução (síntese de proteína a partir do mRNA), processos já descritos em Citologia. O splicing alternativo e as modificações pós-traducionais aumentam enormemente a diversidade de proteínas que podem ser geradas a partir de um número limitado de genes.<br><br>Mutações podem ser pontuais (troca de uma base), por inserção ou deleção de bases (podendo causar mudança da fase de leitura – frameshift) ou por expansões de repetições de trinucleotídeos. Existem vários sistemas de reparo do DNA; quando esses sistemas falham, aumenta o risco de câncer e surgem síndromes genéticas específicas.<br><div class='hy'><strong>Provas:</strong> Análogos de nucleosídeos são amplamente usados como antivirais e em quimioterapia (exemplos: AZT, aciclovir, sofosbuvir). O xeroderma pigmentoso resulta de defeito no reparo por excisão de nucleotídeo. A síndrome de Lynch (HNPCC) resulta de defeito no sistema de reparo de mismatches. A técnica de PCR permite amplificar milhões de vezes um trecho específico de DNA e é a base de muitos exames diagnósticos.</div>"},
{t:"Integração Metabólica: Estado Alimentado versus Jejum",s:"O metabolismo muda radicalmente conforme o organismo está no estado alimentado ou em jejum. No <strong>estado alimentado</strong> (após uma refeição) a insulina está elevada. A glicose é oxidada pela glicólise, armazenada como glicogênio (no fígado e no músculo) e convertida em gordura (lipogênese). O músculo esquelético e o tecido adiposo captam glicose com a ajuda do transportador GLUT4 (que é recrutado para a membrana sob ação da insulina).<br><br>No <strong>jejum</strong> sobem o glucagon e a adrenalina (e, em jejuns mais longos, o cortisol e o hormônio do crescimento). O fígado quebra seu glicogênio (glicogenólise) e ativa a gliconeogênese (produção de glicose a partir de lactato, glicerol e aminoácidos glicogênicos). Depois de várias horas de jejum a lipólise no tecido adiposo se intensifica e o fígado passa a produzir corpos cetônicos. O ciclo de Cori (lactato produzido no músculo e nos glóbulos vermelhos é convertido em glicose no fígado) e o ciclo alanina-glicose ajudam a manter a glicemia.<br><br>O fígado é o grande centro integrador do metabolismo. O cérebro prefere glicose, mas é capaz de se adaptar e utilizar corpos cetônicos em jejuns prolongados, poupando proteína muscular.<br><div class='hy'><strong>Provas:</strong> A gliconeogênese não consegue converter Acetil-CoA em glicose de forma líquida (por isso gordura pura não eleva a glicemia). Após cerca de 24 horas de jejum as reservas de glicogênio hepático estão praticamente esgotadas. Insulina e glucagon têm efeitos opostos e coordenados sobre as enzimas-chave da glicólise e da gliconeogênese.</div>"}
]},
micro:{d:"Microbiologia",i:"🧫",r:"Murray – Medical Microbiology; Jawetz, Melnick & Adelberg; Tortora – Microbiology.",t:[
{t:"Bactérias – Estrutura, Coloração e Classificação",s:"As bactérias são microrganismos procariontes (não têm núcleo delimitado por membrana). Sua estrutura básica inclui: parede celular contendo peptidoglicano, membrana citoplasmática, citoplasma com ribossomos 70S e um nucleoide formado por DNA circular. Muitas bactérias possuem ainda cápsula, flagelos (para mobilidade), fímbrias ou pili (para adesão) e plasmídeos (pequenas moléculas de DNA extracromossômico que podem carregar genes de resistência a antibióticos). Algumas espécies do gênero Clostridium e Bacillus formam esporos, estruturas extremamente resistentes ao calor, à dessecação e a desinfetantes.<br><br>A coloração de Gram divide as bactérias em dois grandes grupos. As <strong>Gram-positivas</strong> têm parede espessa de peptidoglicano e retêm o corante violeta-cristal (ficam roxas). As <strong>Gram-negativas</strong> têm parede fina de peptidoglicano e uma membrana externa rica em lipopolissacarídeo (LPS ou endotoxina); elas não retêm o violeta e são coradas pela safranina (ficam cor-de-rosa). O LPS é um potente indutor de inflamação e pode causar febre, vasodilatação e choque séptico. A coloração de Ziehl-Neelsen identifica as bactérias álcool-ácido resistentes (principalmente as micobactérias).<br><div class='hy'><strong>Provas:</strong> O LPS (endotoxina) existe apenas nas bactérias Gram-negativas e é o principal desencadeador do choque séptico de origem bacteriana. Os esporos resistem à maioria dos desinfetantes comuns – a autoclave (calor úmido sob pressão) é o método mais confiável de esterilização. A cápsula é um importante fator de virulência (dificulta a fagocitose) em pneumococo, meningococo, Haemophilus influenzae e Klebsiella.</div>"},
{t:"Principais Bactérias de Interesse Médico",s:"Entre as Gram-positivas de maior importância clínica destacam-se: Staphylococcus aureus (infecções de pele e partes moles, abscessos, osteomielite, endocardite, pneumonia, sepse; cepas MRSA são resistentes à meticilina/oxacilina), Streptococcus pyogenes (faringite, escarlatina, erisipela, febre reumática e glomerulonefrite pós-estreptocócica), Streptococcus pneumoniae (pneumonia comunitária, meningite, otite média), Enterococcus, Clostridium (C. difficile – colite associada a antibióticos; C. tetani – tétano; C. botulinum – botulismo; C. perfringens – gangrena gasosa), Listeria monocytogenes e Corynebacterium diphtheriae.<br><br>Entre as Gram-negativas: Escherichia coli (principal causa de infecção urinária comunitária, diarreias, sepse neonatal), Pseudomonas aeruginosa (infecções oportunistas, especialmente em hospitalizados e em pacientes com fibrose cística), Neisseria meningitidis e N. gonorrhoeae, Haemophilus influenzae, Salmonella, Shigella, Vibrio cholerae, Helicobacter pylori (gastrite, úlcera péptica e associado a adenocarcinoma gástrico) e Bacteroides (anaeróbios intestinais).<br><br>As micobactérias (álcool-ácido resistentes) incluem Mycobacterium tuberculosis (tuberculose) e M. leprae (hanseníase).<br><div class='hy'><strong>Provas:</strong> A causa mais comum de infecção urinária comunitária é Escherichia coli. A pneumonia comunitária “típica” clássica é causada pelo pneumococo. A meningite bacteriana em adolescentes e adultos jovens é frequentemente causada pelo meningococo. MRSA exige tratamento com vancomicina ou outras opções reservadas. Helicobacter pylori está fortemente associado a gastrite crônica, úlcera péptica e câncer gástrico.</div>"},
{t:"Vírus – Estrutura, Classificação e Replicação",s:"Os vírus são os menores agentes infecciosos e são parasitas intracelulares obrigatórios – só conseguem se replicar dentro de células vivas. Sua estrutura básica compreende o material genético (que pode ser DNA ou RNA, fita simples ou dupla, linear ou circular) protegido por uma capa proteica chamada capsídeo. Alguns vírus ainda possuem um envelope lipídico externo, derivado da membrana da célula hospedeira. Vírus envelopados costumam ser mais frágeis no ambiente externo (sensíveis a detergentes, solventes e dessecação) do que os vírus nus.<br><br>O ciclo replicativo geral de um vírus inclui: adsorção (ligação a receptores da célula), penetração, decapsidação (liberação do genoma), replicação do material genético e síntese das proteínas virais, montagem de novas partículas e liberação (por lise celular ou por brotamento). A classificação de Baltimore organiza os vírus de acordo com a natureza do seu genoma e a estratégia usada para produzir mRNA.<br><br>Exemplos de grande importância médica: família Herpesviridae (herpes simples, varicela-zóster, citomegalovírus, Epstein-Barr – caracterizados por latência), HIV (retrovírus que possui transcriptase reversa e integra seu genoma ao da célula), influenza, SARS-CoV-2, vírus das hepatites, HPV, sarampo, caxumba e rubéola.<br><div class='hy'><strong>Provas:</strong> Vírus envelopados são mais sensíveis a desinfetantes e à dessecação do que vírus nus. O HIV é um retrovírus e precisa da transcriptase reversa para converter seu RNA em DNA. Os herpesvírus estabelecem latência (em gânglios sensitivos ou em células linfoides) e podem reativar periodicamente. Vacinas de vírus vivos atenuados geralmente induzem resposta imune mais robusta e duradoura do que vacinas de vírus inativados.</div>"},
{t:"Fungos de Interesse Médico",s:"Os fungos são organismos eucarióticos. Sua parede celular contém quitina e sua membrana plasmática contém ergosterol (em vez de colesterol). O ergosterol é o alvo de vários antifúngicos importantes (azóis, anfotericina B e equinocandinas). Do ponto de vista morfológico os fungos podem crescer como leveduras (células unicelulares que se reproduzem por brotamento – exemplos: Candida e Cryptococcus), como filamentos (hifas formando mofos – exemplos: Aspergillus e dermatofitos) ou de forma dimórfica (crescem como mofo no ambiente e como levedura no tecido – exemplos: Histoplasma, Paracoccidioides e Blastomyces).<br><br>As infecções fúngicas (micoses) podem ser superficiais (pele, unhas e mucosas), subcutâneas ou sistêmicas/profundas. As micoses sistêmicas são mais frequentes e graves em pacientes imunocomprometidos.<br><div class='hy'><strong>Provas:</strong> A candidíase oral (sapinho) ou esofágica é um marcador clássico de imunodeficiência, especialmente na infecção pelo HIV. A paracoccidioidomicose é a micose sistêmica mais importante no Brasil. Cryptococcus neoformans causa meningite especialmente em pacientes com AIDS. O diagnóstico de muitas micoses profundas depende de cultivo, histopatologia e, cada vez mais, de métodos moleculares e antígenos.</div>"},
{t:"Controle Microbiano, Esterilização e Resistência",s:"É importante distinguir três conceitos:<br>• <strong>Esterilização:</strong> eliminação ou inativação de todas as formas de vida microbiana, inclusive esporos. O método mais usado e confiável é a autoclave (vapor saturado sob pressão).<br>• <strong>Desinfecção:</strong> redução do número de microrganismos em superfícies ou objetos inanimados (não elimina necessariamente esporos).<br>• <strong>Antissepsia:</strong> redução de microrganismos em tecidos vivos (pele e mucosas).<br><br>A resistência bacteriana aos antibióticos pode ocorrer por vários mecanismos: produção de enzimas que inativam o fármaco (exemplo clássico: beta-lactamases, incluindo ESBL e carbapenemases), alteração do alvo do antibiótico (como a modificação das PBPs no MRSA), bombas de efluxo que expulsam o antibiótico para fora da bactéria, diminuição da permeabilidade da parede/membrana e formação de biofilme (comunidade bacteriana protegida por uma matriz polimérica).<br><div class='hy'><strong>Provas:</strong> O uso racional e criterioso de antibióticos é a principal estratégia para conter a resistência. MRSA, enterococos resistentes à vancomicina (VRE), enterobactérias produtoras de ESBL e de carbapenemases são grandes problemas de saúde pública hospitalar. Sempre que possível deve-se colher material para cultura antes de iniciar o antibiótico. A higienização das mãos continua sendo a medida isolada mais eficaz para prevenir a transmissão de infecções relacionadas à assistência à saúde.</div>"},
{t:"Mecanismos de Patogenicidade e Virulência Bacteriana",s:"A capacidade de uma bactéria causar doença depende de seus fatores de virulência. Entre os principais estão:<br><br>• Adesinas (pili, fímbrias e outras proteínas de superfície) – permitem a fixação às células do hospedeiro.<br>• Cápsula – dificulta a fagocitose.<br>• Invasinas e enzimas que degradam tecidos (hialuronidase, colagenase, coagulase, hemolisinas etc.).<br>• Toxinas – podem ser exotoxinas (proteínas secretadas, muitas vezes com ação muito específica e potente) ou endotoxina (LPS da parede das Gram-negativas).<br>• Sistemas de secreção (especialmente o tipo III) que injetam proteínas diretamente no citoplasma da célula hospedeira.<br>• Capacidade de formar biofilme e de variar antígenos de superfície (variação de fase).<br><br>Exemplos clássicos de exotoxinas: toxina tetânica, toxina botulínica, toxina diftérica, toxina colérica e as toxinas de Staphylococcus aureus e Streptococcus pyogenes (incluindo superantígenos).<br><div class='hy'><strong>Provas:</strong> A endotoxina (LPS) existe apenas em Gram-negativas e é responsável pela grande parte da resposta inflamatória sistêmica do choque séptico. Muitas exotoxinas são usadas na forma de toxoides (inativadas) nas vacinas (tétano e difteria). O biofilme protege as bactérias da ação dos antibióticos e do sistema imune e está envolvido em infecções de cateteres, próteses, endocardite e na infecção pulmonar crônica da fibrose cística.</div>"}
]},
para:{d:"Parasitologia",i:"🐛",r:"Neves – Parasitologia Humana; Rey – Bases da Parasitologia Médica; CDC DPDx.",t:[
{t:"Protozoários Intestinais",s:"Os principais protozoários que parasitam o intestino humano são Giardia lamblia, Entamoeba histolytica e Cryptosporidium.<br><br><strong>Giardia lamblia</strong> (também chamada G. duodenalis ou G. intestinalis) causa um quadro de diarreia crônica ou intermitente, frequentemente com esteatorreia (fezes gordurosas), distensão abdominal e sinais de má absorção. A transmissão é fecal-oral, por meio de cistos que contaminam água ou alimentos. É comum em creches e entre viajantes. O diagnóstico pode ser feito pelo exame parasitológico de fezes (pesquisa de cistos ou trofozoítos), por detecção de antígeno ou por PCR. O tratamento de escolha envolve metronidazol, tinidazol ou nitazoxanida.<br><br><strong>Entamoeba histolytica</strong> causa a amebíase. A forma intestinal clássica é a disenteria amebiana (diarreia com sangue e muco). Pode também invadir a parede intestinal e, por via hematogênica, formar abscessos (principalmente no fígado). É fundamental diferenciar E. histolytica da E. dispar, que é morfologicamente idêntica mas não patogênica. O tratamento da doença invasiva usa metronidazol (ou tinidazol) seguido de um amebicida luminal (paromomicina ou furoato de diloxanida) para eliminar os cistos do lúmen intestinal.<br><br><strong>Cryptosporidium</strong> causa diarreia aquosa. Em pessoas imunocompetentes o quadro costuma ser autolimitado; em imunocomprometidos (especialmente pacientes com HIV e CD4 baixo) a diarreia pode ser grave, prolongada e ameaçadora à vida. O parasito é resistente às concentrações habituais de cloro usadas no tratamento de água. O diagnóstico usa coloração álcool-ácido resistente modificada, detecção de antígeno ou PCR.<br><div class='hy'><strong>Provas:</strong> Giardia é um dos protozoários intestinais mais comuns em creches e em surtos. O abscesso hepático amebiano é mais frequente em homens adultos. Cryptosporidium é um agente importante de diarreia em pacientes com AIDS e em surtos de transmissão hídrica.</div>"},
{t:"Protozoários Sanguíneos e Teciduais",s:"Os principais protozoários que acometem sangue e tecidos são os plasmódios (malária), o Trypanosoma cruzi (doença de Chagas), as leishmânias e o Toxoplasma gondii.<br><br><strong>Malária</strong> é causada por protozoários do gênero Plasmodium e transmitida pela picada do mosquito Anopheles. As espécies mais importantes são P. falciparum (responsável pela forma mais grave, inclusive malária cerebral), P. vivax e P. ovale (podem formar hipnozoítos no fígado e causar recidivas), P. malariae e P. knowlesi. O diagnóstico clássico é feito pela gota espessa e pelo esfregaço fino de sangue periférico. O tratamento da malária por P. falciparum utiliza combinações à base de artemisinina (ACT); para as espécies que formam hipnozoítos usa-se primaquina (após testar deficiência de G6PD).<br><br><strong>Doença de Chagas</strong> é causada pelo Trypanosoma cruzi e transmitida principalmente pelas fezes de triatomíneos (barbeiros) infectados. Tem uma fase aguda (às vezes com chagoma de inoculação ou sinal de Romaña) e uma fase crônica que pode evoluir com cardiopatia (miocardiopatia dilatada) e/ou megaesôfago e megacólon. O tratamento específico (benznidazol ou nifurtimox) é mais eficaz na fase aguda.<br><br><strong>Leishmaniose</strong> é transmitida por flebotomíneos (mosquito-palha). Pode se apresentar na forma cutânea, mucocutânea ou visceral (calazar – febre, hepatoesplenomegalia e pancitopenia).<br><br><strong>Toxoplasmose</strong> é causada pelo Toxoplasma gondii. A infecção pode ser adquirida pela ingestão de oocistos eliminados nas fezes de gatos ou pela ingestão de carne crua/malpassada contendo cistos. É especialmente grave quando ocorre na gestação (transmissão congênita) ou em pacientes imunocomprometidos (encefalite por reativação). A tríade clássica da toxoplasmose congênita de Sabin inclui coriorretinite, calcificações intracranianas e hidrocefalia.<br><div class='hy'><strong>Provas:</strong> Na malária grave o tratamento de escolha atual é o artesunato. A doença de Chagas é endêmica em várias regiões do Brasil e da América Latina. A toxoplasmose congênita e a encefalite toxoplásmica em pacientes com AIDS são clássicas em provas. A profilaxia da toxoplasmose cerebral em pacientes com HIV e CD4 baixo é feita com sulfametoxazol-trimetoprim.</div>"},
{t:"Helmintos – Nematoides (Vermes Redondos)",s:"Os nematoides de maior importância médica incluem Ascaris lumbricoides, os ancilostomídeos, Enterobius vermicularis e Strongyloides stercoralis.<br><br><strong>Ascaris lumbricoides</strong> é o maior nematoide intestinal que parasita o homem. O ciclo inclui uma fase de migração pulmonar (que pode causar a síndrome de Löeffler – tosse, eosinofilia e infiltrados pulmonares transitórios). Massas de vermes adultos podem causar obstrução intestinal ou biliar. O tratamento é feito com albendazol ou mebendazol.<br><br><strong>Ancilostomídeos</strong> (Necator americanus e Ancylostoma duodenale) penetram pela pele (geralmente dos pés), migram pelos pulmões e se fixam na mucosa do intestino delgado, onde se alimentam de sangue. Causam anemia ferropriva (o clássico “amarelão”). O tratamento usa albendazol ou mebendazol, associado à reposição de ferro.<br><br><strong>Enterobius vermicularis</strong> (oxiúrus) causa intenso prurido anal, especialmente noturno (a fêmea migra para a região perianal para ovipor). O diagnóstico é feito pelo teste da fita adesiva (scotch-tape test) pela manhã, antes da higiene local. O tratamento usa albendazol ou mebendazol e deve incluir os contatos domiciliares.<br><br><strong>Strongyloides stercoralis</strong> tem a particularidade de poder completar o ciclo dentro do próprio hospedeiro (autoinfecção). Em pacientes tratados com corticoides ou infectados pelo HTLV-1 pode ocorrer a síndrome de hiperinfecção, potencialmente fatal. O tratamento de escolha é a ivermectina.<br><div class='hy'><strong>Provas:</strong> Anemia + eosinofilia + história de zona rural ou hábito de andar descalço deve fazer pensar em ancilostomídeo. O Strongyloides deve ser pesquisado antes de se iniciar corticoide em dose imunossupressora em pacientes provenientes de áreas endêmicas. O Enterobius é extremamente comum em crianças em idade escolar e causa o clássico prurido anal noturno.</div>"},
{t:"Helmintos – Cestoides e Trematodes",s:"Entre os cestoides (vermes em forma de fita) destacam-se as tênias. Taenia solium (tênia do porco) e Taenia saginata (tênia do boi) causam a teníase (presença do verme adulto no intestino delgado). A grande importância da T. solium é que o homem também pode servir de hospedeiro intermediário: a ingestão de ovos leva à cisticercose. A forma mais grave é a neurocisticercose (presença de cisticercos no sistema nervoso central), uma das principais causas de epilepsia de início tardio em áreas endêmicas. O tratamento da teníase usa praziquantel ou niclosamida. O tratamento da neurocisticercose é mais complexo e pode envolver albendazol ou praziquantel, corticoides, anticonvulsivantes e, em alguns casos, cirurgia.<br><br>Entre os trematodes (vermes em forma de folha) o de maior importância no Brasil é o <strong>Schistosoma mansoni</strong>. A transmissão ocorre quando cercárias liberadas por caramujos do gênero Biomphalaria (água doce) penetram a pele do homem. A fase aguda pode cursar com dermatite cercariana e, semanas depois, com a síndrome de Katayama. Na fase crônica a doença pode evoluir com fibrose periportal e hipertensão portal (a clássica “barriga d’água”). O diagnóstico se baseia no encontro de ovos nas fezes (método de Kato-Katz). O tratamento de escolha é o praziquantel.<br><div class='hy'><strong>Provas:</strong> A neurocisticercose é uma das principais causas de epilepsia em adultos em várias regiões do Brasil e da América Latina. A esquistossomose mansoni é endêmica em importantes áreas do país. Tanto a teníase quanto a esquistossomose são tratadas com praziquantel.</div>"},
{t:"Diagnóstico e Controle das Parasitoses",s:"O diagnóstico das parasitoses utiliza métodos variados conforme o agente. O exame parasitológico de fezes (com técnicas de concentração como Hoffman, Faust ou Baermann) continua sendo a base para a maioria das enteroparasitoses. A gota espessa e o esfregaço fino são fundamentais para a malária. O teste da fita adesiva diagnostica a oxiuríase. Sorologias e métodos moleculares (PCR) são cada vez mais usados, especialmente em infecções teciduais e em imunocomprometidos.<br><br>O controle e a prevenção das parasitoses assentam-se em medidas de saneamento básico (água tratada e destino adequado dos dejetos), higiene pessoal e dos alimentos, controle de vetores (em doenças como malária, Chagas e leishmaniose), tratamento dos indivíduos infectados (incluindo tratamento em massa em algumas endemias) e educação em saúde. Algumas parasitoses são de notificação compulsória.<br><div class='hy'><strong>Provas:</strong> A prevenção primária mais eficaz das enteroparasitoses é o saneamento básico associado à higiene das mãos e dos alimentos. A eosinofilia no hemograma deve fazer pensar em helmintíases com migração tecidual. Sempre se deve interpretar o resultado do exame parasitológico em conjunto com o quadro clínico e os dados epidemiológicos.</div>"},
{t:"Ciclos Biológicos e Conceitos Epidemiológicos",s:"Para entender e controlar as parasitoses é fundamental conhecer o ciclo biológico de cada agente. Alguns parasitos completam todo o ciclo em um único hospedeiro (ciclo monoxeno). Outros precisam de mais de um hospedeiro (ciclo heteroxeno), distinguindo-se o hospedeiro definitivo (aquele em que o parasito atinge a maturidade sexual) do hospedeiro intermediário (aquele em que ocorrem formas larvárias ou de reprodução assexuada).<br><br>Também é importante distinguir a forma infectante (aquela que consegue iniciar a infecção no homem) da forma diagnóstica (aquela que é pesquisada nos exames laboratoriais). As vias de transmissão mais comuns são: fecal-oral, penetração ativa através da pele, picada de vetores, ingestão de carne malpassada e transmissão vertical (da mãe para o filho).<br><br>Muitas das parasitoses de importância no Brasil são zoonoses ou doenças tropicais negligenciadas e estão intimamente ligadas a condições de pobreza e falta de saneamento.<br><div class='hy'><strong>Provas:</strong> Conhecer o ciclo biológico permite identificar os pontos em que a transmissão pode ser interrompida. No caso do Plasmodium, o mosquito Anopheles é o hospedeiro definitivo e o homem é o hospedeiro intermediário. No caso da Taenia solium o homem pode atuar tanto como hospedeiro definitivo (teníase) quanto como hospedeiro intermediário (cisticercose).</div>"}
]},
biofis:{d:"Biofísica",i:"⚡",r:"Davidovits – Physics in Biology and Medicine; Hobbie & Roth – Intermediate Physics for Medicine and Biology.",t:[
{t:"Biofísica de Membranas e Potenciais Bioelétricos",s:"A membrana celular pode ser modelada, do ponto de vista elétrico, como um capacitor (a bicamada lipídica) em paralelo com um resistor (os canais iônicos). O potencial de repouso da maioria das células excitáveis fica em torno de –70 mV e é determinado principalmente pela permeabilidade seletiva da membrana ao íon potássio (descrita pelas equações de Nernst e de Goldman-Hodgkin-Katz). A bomba Na⁺/K⁺-ATPase mantém os gradientes iônicos de longo prazo, mas a permeabilidade ao K⁺ é o que define o valor do potencial de repouso a cada instante.<br><br>O potencial de ação é gerado pela abertura sequencial de canais iônicos voltagem-dependentes: primeiro os canais de sódio (que despolarizam a membrana) e depois os canais de potássio (que a repolarizam). O período refratário (absoluto e relativo) impede que a célula dispare novos potenciais de ação de forma imediata e descontrolada e limita a frequência máxima de impulsos. Nas fibras mielinizadas a condução é saltatória (o potencial “pula” de um nódulo de Ranvier para outro), o que aumenta enormemente a velocidade de propagação.<br><div class='hy'><strong>Provas:</strong> Os anestésicos locais bloqueiam os canais de sódio voltagem-dependentes e impedem a geração e a condução do potencial de ação. O período refratário é o que impede o tétano no músculo cardíaco. A equação de Nernst permite calcular o potencial de equilíbrio de cada íon separadamente. A mielina aumenta a resistência transversal da membrana e diminui sua capacitância, favorecendo a condução saltatória.</div>"},
{t:"Biofísica Cardiovascular e Respiratória",s:"Do ponto de vista físico, o fluxo sanguíneo através de um vaso pode ser descrito de forma análoga à Lei de Ohm: fluxo = diferença de pressão / resistência. A resistência ao fluxo depende fortemente do raio do vaso (Lei de Poiseuille): a resistência é inversamente proporcional à quarta potência do raio. Isso significa que pequenas variações no calibre das arteríolas (controladas pelo sistema nervoso autônomo e por fatores locais) produzem grandes alterações no fluxo sanguíneo para um órgão.<br><br>A Lei de Laplace relaciona a tensão na parede de uma estrutura cilíndrica ou esférica com a pressão interna e o raio. Por isso, aneurismas (que têm raio aumentado) sofrem maior tensão na parede e têm maior risco de ruptura. Da mesma forma, um ventrículo dilatado precisa gerar mais tensão para produzir a mesma pressão, o que aumenta o consumo de oxigênio do miocárdio.<br><br>No sistema respiratório o surfactante pulmonar (produzido pelos pneumócitos tipo II) reduz a tensão superficial no interior dos alvéolos. Isso facilita a expansão alveolar e, mais importante, estabiliza alvéolos de diferentes tamanhos, impedindo que os menores colapseem em favor dos maiores.<br><div class='hy'><strong>Provas:</strong> Pequenas mudanças no raio arteriolar alteram muito a resistência e o fluxo (daí a importância do controle do tônus arteriolar). A deficiência de surfactante causa a síndrome do desconforto respiratório do recém-nascido. Aneurismas e dilatação ventricular aumentam a tensão parietal pela Lei de Laplace e elevam o consumo de oxigênio.</div>"},
{t:"Radiação Ionizante e Proteção Radiológica",s:"A radiação pode ser ionizante ou não ionizante. A radiação ionizante (raios X, raios gama, partículas alfa e beta) tem energia suficiente para arrancar elétrons dos átomos e gerar íons. Ela pode danificar diretamente o DNA ou gerar radicais livres a partir da água (efeito indireto). A radiação não ionizante (ultravioleta, luz visível, infravermelho, micro-ondas, radiofrequência) tem menos energia e não consegue ionizar átomos da mesma forma.<br><br>Os efeitos biológicos da radiação ionizante se dividem em determinísticos (têm dose limiar e a gravidade aumenta com a dose – exemplos: eritema cutâneo, catarata, síndrome aguda da radiação) e estocásticos (não têm limiar claro; a probabilidade de ocorrência aumenta com a dose, mas a gravidade não – exemplos: câncer e efeitos hereditários).<br><br>As grandezas usadas em radioproteção incluem a dose absorvida (medida em Gray), a dose equivalente e a dose efetiva (medidas em Sievert). Os três princípios fundamentais da proteção radiológica são: reduzir o tempo de exposição, aumentar a distância da fonte e usar blindagem adequada. O princípio ALARA (As Low As Reasonably Achievable) orienta que as doses sejam mantidas tão baixas quanto razoavelmente possível.<br><div class='hy'><strong>Provas:</strong> Gestantes e crianças são mais radiossensíveis e exigem cuidado redobrado. O ultrassom e a ressonância magnética não utilizam radiação ionizante (ao contrário da radiografia e da tomografia computadorizada). A dose efetiva leva em consideração a radiosensibilidade diferente dos diversos tecidos e órgãos.</div>"},
{t:"Biofísica da Visão e da Audição",s:"O olho funciona como um sistema óptico. A córnea é responsável pela maior parte do poder de refração do olho. O cristalino ajusta o foco para objetos em diferentes distâncias (processo chamado acomodação). A imagem é formada na retina, onde células fotorreceptoras (cones e bastonetes) transformam a luz em sinais elétricos. Os principais erros de refração são: miopia (a imagem se forma na frente da retina – corrige-se com lentes divergentes), hipermetropia (a imagem tenderia a se formar atrás da retina – corrige-se com lentes convergentes), astigmatismo (a córnea ou o cristalino não são esféricos) e presbiopia (perda da capacidade de acomodação com o envelhecimento).<br><br>No sistema auditivo as ondas sonoras são captadas pela orelha externa, transmitidas e amplificadas pela orelha média (membrana timpânica e cadeia de ossículos – martelo, bigorna e estribo) e transformadas em sinais elétricos na orelha interna (cóclea). Dentro da cóclea o órgão de Corti contém as células ciliadas, que são os verdadeiros receptores auditivos. A posição ao longo da cóclea codifica a frequência do som e a amplitude do movimento codifica a intensidade.<br><div class='hy'><strong>Provas:</strong> A presbiopia é uma alteração universal do envelhecimento e resulta da perda progressiva da elasticidade do cristalino. A audiometria tonal avalia os limiares auditivos em diferentes frequências. O exame de fundo de olho permite visualizar diretamente vasos sanguíneos e o nervo óptico, sendo uma janela importante para doenças sistêmicas (diabetes, hipertensão) e neurológicas.</div>"}
]}
};

const CAS = [
{t:"1. Homeostase e Feedback",c:"O organismo mantém variáveis como glicemia, pressão arterial, temperatura e pH dentro de faixas estreitas por meio de feedback negativo. Um sensor detecta o desvio, um centro integrador processa a informação e efetores corrigem o desvio. Quando esse sistema falha, surge doença. O feedback positivo é raro e amplifica a mudança (exemplos: parto, coagulação e potencial de ação)."},
{t:"2. Potencial de Ação Neural",c:"Em repouso a membrana do neurônio está cerca de –70 mV. Quando o estímulo atinge o limiar, abrem-se canais de sódio voltagem-dependentes e a membrana despolariza rapidamente. Em seguida os canais de sódio se inativam e abrem-se os de potássio, repolarizando a célula. Nas fibras mielinizadas a condução é saltatória. Esse mecanismo é a base da ação dos anestésicos locais."},
{t:"3. Produção de ATP",c:"A glicose e os ácidos graxos são convertidos em Acetil-CoA, que entra no Ciclo de Krebs. Os NADH e FADH₂ gerados doam elétrons para a cadeia respiratória, cujo funcionamento produz um gradiente de prótons usado pela ATP-sintase para fabricar ATP. O oxigênio é o aceptor final dos elétrons. Sem oxigênio a célula depende apenas da glicólise (saldo de 2 ATP e formação de lactato)."},
{t:"4. Inflamação",c:"A inflamação aguda cursa com os sinais clássicos de rubor, calor, tumor e dor. Os neutrófilos são as primeiras células a chegar. Mediadores importantes incluem histamina, prostaglandinas, leucotrienos e citocinas. Na inflamação crônica predominam linfócitos e macrófagos e pode haver formação de granuloma (especialmente na tuberculose)."},
{t:"5. Imunidade Inata versus Adaptativa",c:"A imunidade inata é rápida, inespecífica e não gera memória clássica. A imunidade adaptativa é específica, demora mais para aparecer na primeira exposição, mas gera memória. Linfócitos B produzem anticorpos; linfócitos T coordenam a resposta e matam células infectadas. As vacinas exploram justamente a memória da imunidade adaptativa."},
{t:"6. Ciclo Celular e Câncer",c:"O ciclo celular progride de G1 para S, G2 e M sob controle de ciclinas, CDKs e pontos de checagem (p53 e Rb são centrais). Proto-oncogenes se transformam em oncogenes por ganho de função; genes supressores de tumor contribuem para o câncer quando perdem a função. Os hallmarks do câncer incluem proliferação autônoma, evasão da apoptose, angiogênese e capacidade de metástase."},
{t:"7. Sistema Renina-Angiotensina-Aldosterona",c:"Queda da pressão arterial ou do volume efetivo estimula a liberação de renina. A renina leva à formação de angiotensina II, que causa vasoconstrição, libera aldosterona e estimula a sede e a liberação de ADH. Esse eixo é alvo dos IECA e dos bloqueadores do receptor de angiotensina e tem papel central na hipertensão, na insuficiência cardíaca e na doença renal crônica."},
{t:"8. Equilíbrio Ácido-Base",c:"O pH arterial normal situa-se entre 7,35 e 7,45. O principal tampão extracelular é o sistema bicarbonato/ácido carbônico. O pulmão regula a PaCO₂ de forma rápida; o rim regula o bicarbonato e a excreção de ácidos de forma mais lenta. A gasometria arterial é o exame fundamental para o diagnóstico dos distúrbios ácido-base."},
{t:"9. Integração Metabólica",c:"No estado alimentado predomina a ação da insulina (glicólise, glicogênese, lipogênese). No jejum predomina a ação do glucagon e da adrenalina (glicogenólise, gliconeogênese, lipólise e, depois, cetogênese). O fígado é o órgão central dessa integração. O cérebro prefere glicose, mas consegue utilizar corpos cetônicos em jejuns prolongados."},
{t:"10. Raciocínio Básico em Situações de Emergência",c:"A abordagem inicial de qualquer paciente grave segue a sequência ABCDE (Airway, Breathing, Circulation, Disability, Exposure). Depois se procede à anamnese e ao exame físico dirigidos e se formulam hipóteses diagnósticas. Em PCR, AVE, infarto e sepse o tempo é um fator crítico para o prognóstico."}
];

function showSum(k,i){const c=D[k],t=c.t[i];pt.textContent=t.t;ct.innerHTML="";const wrap=document.createElement("div");wrap.className="sv";const back=document.createElement("button");back.className="btn";back.style.marginBottom="1rem";back.textContent="← Voltar";back.addEventListener("click",()=>showCat(k));wrap.appendChild(back);const card=document.createElement("div");card.className="sc";card.innerHTML='<span class="badge">'+c.i+" "+c.d+"</span><h2>"+t.t+'</h2><div class="body">'+t.s+'</div><div class="rb"><h4>📖 Referências desta área</h4><p>'+c.r+"</p></div>";wrap.appendChild(card);ct.appendChild(wrap)}

function home(){document.querySelectorAll(".ni").forEach(b=>b.classList.remove("on"));pt.textContent="Início";let n=0;Object.values(D).forEach(c=>n+=cnt(c));ct.innerHTML='<div class="wel"><h2>🩺 PenseQuizMed – Resumos Didáticos</h2><p>Resumos <strong>muito longos, detalhados e didáticos</strong> das áreas fundamentais (incluindo Fisiologia completa e Ciclo de Krebs expandido) das <strong>Ciências da Saúde e Biologia Humana</strong>. Conteúdo expandido para estudo profundo e preparação para provas.</p><div class="st"><div><div class="n">'+Object.keys(D).length+'</div><div class="l">Áreas</div></div><div><div class="n">'+n+'</div><div class="l">Tópicos</div></div><div><div class="n">10</div><div class="l">Conceitos Cascata</div></div></div><p style="margin-top:1.8rem;font-size:.88rem;color:var(--mu)">Use o menu lateral, a busca ou o botão <strong>Cascata</strong>.</p></div>'}
function refs(){pt.textContent="Referências";ct.innerHTML='<div class="rg"><h3>📚 Referências Completas</h3>'+REFS+"</div>"}
q.addEventListener("input",function(){const s=q.value.trim().toLowerCase();if(!s){home();return}const res=[];Object.entries(D).forEach(([k,c])=>{c.t.forEach((t,i)=>{if(t.t.toLowerCase().includes(s)||t.s.toLowerCase().includes(s))res.push({k,i,t,d:c.d,ic:c.i})})});pt.textContent='Busca: "'+s+'"';if(!res.length){ct.innerHTML='<div style="text-align:center;padding:3rem;color:var(--mu)">Nenhum resultado.</div>';return}ct.innerHTML="";const grid=document.createElement("div");grid.className="grid";res.forEach(r=>{const card=document.createElement("div");card.className="tc";card.innerHTML="<h3>"+r.t.t+'</h3><p style="font-size:.72rem;color:var(--ac);margin-bottom:.3rem">'+r.ic+" "+r.d+"</p><p>"+r.t.s.replace(/<[^>]+>/g," ").substring(0,130)+"...</p>";card.addEventListener("click",()=>showSum(r.k,r.i));grid.appendChild(card)});ct.appendChild(grid)});
