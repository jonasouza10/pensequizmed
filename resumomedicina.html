<script>
const D = {
bio:{d:"Biologia Geral / Citologia",i:"🧬",r:"Alberts – Molecular Biology of the Cell; Junqueira & Carneiro – Biologia Celular e Molecular; Lodish – Molecular Cell Biology.",t:[
{t:"Membrana Plasmática e Transportes",s:"A membrana plasmática é a fronteira que separa o interior da célula do meio externo. Ela é formada principalmente por uma <strong>bicamada de fosfolipídios</strong>. Cada fosfolipídio tem uma cabeça hidrofílica (que gosta de água) e duas caudas hidrofóbicas (que evitam a água). As cabeças ficam voltadas para o lado de fora e para o lado de dentro da célula, enquanto as caudas ficam no meio da bicamada. Essa organização cria uma barreira seletiva: substâncias lipossolúveis atravessam com facilidade, enquanto íons e moléculas polares precisam de ajuda.<br><br>O <strong>colesterol</strong> se encaixa entre os fosfolipídios e regula a fluidez da membrana. Em temperatura corporal ele impede que a membrana fique mole demais ou rígida demais. As <strong>proteínas</strong> da membrana podem ser integrais (atravessam toda a bicamada) ou periféricas (ficam só de um lado). Muitas proteínas funcionam como canais, transportadores ou receptores. Na face externa existe ainda o <strong>glicocálice</strong>, formado por açúcares ligados a proteínas e lipídios, importante para reconhecimento entre células e proteção.<br><br><strong>Transportes passivos</strong> (não gastam ATP diretamente):<br>• Difusão simples: O₂, CO₂ e hormônios esteroides atravessam livremente a favor do gradiente.<br>• Difusão facilitada: usa canais (para íons e água) ou carriers (para glicose e aminoácidos).<br>• Osmose: movimento de água através de aquaporinas.<br><br><strong>Transportes ativos</strong> (gastam energia):<br>• A bomba Na⁺/K⁺-ATPase tira 3 sódios da célula e coloca 2 potássios para dentro. Ela mantém o potencial de repouso e cria o gradiente usado por outros transportadores.<br>• Cotransportadores usam o gradiente de sódio para levar outras substâncias (ex.: glicose no intestino e no rim).<br><br>A célula também internaliza material por endocitose (fagocitose, pinocitose e mediada por receptor) e libera substâncias por exocitose.<br><div class='hy'><strong>Alto rendimento:</strong> Hipercolesterolemia familiar = defeito no receptor de LDL. Fibrose cística = mutação no canal de cloreto CFTR. A bomba Na/K consome grande quantidade de ATP em células nervosas e musculares. Anestésicos locais bloqueiam canais de sódio e impedem o potencial de ação.</div>"},
{t:"Mitocôndria e Respiração Celular",s:"A mitocôndria é a organela responsável pela maior parte da produção de energia (ATP) nas células que usam oxigênio. Ela tem <strong>duas membranas</strong>. A externa é relativamente permeável. A interna é muito seletiva e se dobra formando as <strong>cristas</strong>, que aumentam a superfície onde ficam a cadeia transportadora de elétrons e a ATP-sintase. Dentro da matriz mitocondrial ficam as enzimas do Ciclo de Krebs, o DNA mitocondrial (circular e de herança apenas materna) e ribossomos semelhantes aos das bactérias. Essa semelhança apoia a teoria de que a mitocôndria surgiu de uma bactéria que foi engolfada por uma célula ancestral (endossimbiose).<br><br><strong>Como a célula produz ATP a partir da glicose:</strong><br>1. <strong>Glicólise</strong> (no citosol): uma glicose vira dois piruvatos, com saldo de 2 ATP e 2 NADH. Não precisa de oxigênio.<br>2. O piruvato entra na mitocôndria e é transformado em <strong>Acetil-CoA</strong>.<br>3. O Acetil-CoA entra no <strong>Ciclo de Krebs</strong>: a cada volta são gerados 3 NADH, 1 FADH₂, 1 GTP e 2 CO₂.<br>4. Os NADH e FADH₂ doam elétrons para a <strong>cadeia transportadora</strong>. A energia liberada bombeia prótons para fora da matriz, criando um gradiente. A ATP-sintase deixa os prótons voltarem e usa essa energia para fabricar ATP. O oxigênio é o último aceptor dos elétrons e forma água.<br><br>No total, uma glicose rende cerca de 30 a 32 ATP em condições ideais.<br><div class='hy'><strong>Provas clássicas:</strong> Cianeto e monóxido de carbono bloqueiam o Complexo IV. Rotenona bloqueia o Complexo I. Oligomicina inibe a ATP-sintase. Desacopladores transformam a energia do gradiente em calor (tecido adiposo marrom). Doenças mitocondriais têm herança materna e afetam órgãos que gastam muito ATP (cérebro, músculo, coração, nervo óptico).</div>"},
{t:"Retículo Endoplasmático e Complexo de Golgi",s:"O retículo endoplasmático e o Golgi formam o principal sistema de síntese e distribuição de proteínas e lipídios da célula.<br><br>O <strong>Retículo Endoplasmático Rugoso (RER)</strong> tem ribossomos grudados na sua superfície. É nele que são fabricadas as proteínas destinadas à secreção, à membrana plasmática ou aos lisossomos. Enquanto a proteína está sendo montada, ela já entra no lúmen do RER. Lá ela começa a receber açúcares (N-glicosilação) e a se dobrar corretamente com a ajuda de chaperonas. Proteínas com defeito de dobramento são identificadas e enviadas para destruição.<br><br>O <strong>Retículo Endoplasmático Liso (REL)</strong> não tem ribossomos. Suas funções principais são: fabricar lipídios e hormônios esteroides, detoxificar fármacos e toxinas (especialmente no fígado, via citocromo P450) e armazenar cálcio. No músculo o REL é muito especializado e se chama retículo sarcoplasmático: ele guarda o cálcio que dispara a contração.<br><br>O <strong>Complexo de Golgi</strong> funciona como uma central de acabamento e distribuição. As proteínas e lipídios que chegam do retículo passam pelas cisternas do Golgi (face cis → medial → face trans), recebem modificações finais e são empacotados em vesículas. O Golgi também fabrica os lisossomos e as vesículas de secreção.<br><div class='hy'><strong>Provas:</strong> Doenças de armazenamento lisossomal (Tay-Sachs, Gaucher, Niemann-Pick) ocorrem quando falta uma enzima e o substrato se acumula dentro do lisossomo. O estresse do retículo (muitas proteínas mal dobradas) ativa respostas celulares ligadas a diabetes e doenças neurodegenerativas. Células que secretam muito (pâncreas exócrino, plasmócitos) têm RER e Golgi enormes.</div>"},
{t:"Lisossomos, Peroxissomos e Autofagia",s:"Os <strong>lisossomos</strong> são as “estomagos” da célula. Eles mantêm um pH ácido (cerca de 4,5 a 5) graças a bombas de hidrogênio e contêm dezenas de enzimas digestivas capazes de quebrar proteínas, gorduras, açúcares e ácidos nucleicos. Eles digerem tanto material que veio de fora da célula (por endocitose ou fagocitose) quanto partes da própria célula que precisam ser recicladas.<br><br>Os <strong>peroxissomos</strong> fazem reações de oxidação que geram peróxido de hidrogênio (H₂O₂). A enzima catalase logo transforma esse peróxido em água e oxigênio, evitando dano. Eles também oxidam ácidos graxos de cadeia muito longa e participam da síntese de alguns lipídios especiais.<br><br><strong>Autofagia</strong> significa “comer a si mesmo”. A célula envolve organelas velhas ou pedaços de citoplasma em uma vesícula de dupla membrana (autofagossomo). Essa vesícula se funde com o lisossomo e o conteúdo é digerido. A autofagia é fundamental para manter a célula limpa, sobreviver em períodos de jejum, eliminar mitocôndrias danificadas e combater alguns microrganismos intracelulares.<br><div class='hy'><strong>Provas:</strong> Tay-Sachs (falta de hexosaminidase A), Gaucher, Niemann-Pick e doença de Pompe são exemplos clássicos de doenças de armazenamento lisossomal. A síndrome de Zellweger resulta de falha na formação dos peroxissomos. Autofagia com defeito está envolvida em câncer, infecções e doenças neurodegenerativas.</div>"},
{t:"Citoesqueleto e Movimento",s:"O citoesqueleto é o “esqueleto e sistema muscular” da célula. Ele dá forma, permite movimento, organiza as organelas e participa da divisão celular. Existem três tipos principais de filamentos:<br><br><strong>Microtúbulos</strong> (os mais grossos): feitos da proteína tubulina. São polarizados e muito dinâmicos (crescem e encolhem rapidamente). Formam o fuso que separa os cromossomos na mitose, formam cílios e flagelos e servem de trilhos para o transporte de organelas e vesículas. As proteínas motoras kinesina e dineína “andam” sobre os microtúbulos carregando carga.<br><br><strong>Filamentos de actina</strong> (os mais finos): feitos de actina. Também são dinâmicos. Mantêm a forma da célula, formam as microvilosidades do intestino, permitem que a célula migre e participam da contração muscular (junto com a miosina) e da divisão do citoplasma.<br><br><strong>Filamentos intermediários</strong>: mais estáveis e resistentes. Dão resistência mecânica aos tecidos. Exemplos importantes: queratina (pele e epitélios), vimentina (tecido conjuntivo), desmina (músculo), neurofilamentos e lâminas nucleares (que revestem o núcleo).<br><div class='hy'><strong>Provas:</strong> Colchicina e os alcaloides da vinca desmontam os microtúbulos e são usados como antimitóticos. Os taxanos fazem o contrário: estabilizam demais os microtúbulos. A distrofia muscular de Duchenne é causada pela falta de distrofina, uma proteína que liga o citoesqueleto à matriz extracelular. Várias doenças de pele e algumas miopatias envolvem defeitos nos filamentos intermediários.</div>"},
{t:"Núcleo, Cromatina e Ciclo Celular",s:"O núcleo guarda o material genético da célula. O DNA fica enrolado em proteínas chamadas histonas, formando nucleossomos, que se organizam em fibras de cromatina. Quando a cromatina está mais frouxa (eucromatina), os genes podem ser lidos. Quando está bem condensada (heterocromatina), os genes ficam silenciosos. O nucléolo é a região do núcleo onde são fabricados os ribossomos.<br><br>O <strong>ciclo celular</strong> é a sequência de eventos que leva à divisão da célula:<br>• Na fase G1 a célula cresce e se prepara para copiar o DNA.<br>• Na fase S o DNA é duplicado.<br>• Na fase G2 a célula se prepara para a mitose.<br>• Na fase M ocorre a mitose (separação dos cromossomos) e a citocinese (divisão do citoplasma).<br><br>A passagem de uma fase para outra é controlada por proteínas chamadas ciclinas e por enzimas chamadas CDKs. Existem pontos de checagem que verificam se está tudo certo antes de continuar. O gene <strong>p53</strong> é um dos principais guardiões: se o DNA estiver danificado, o p53 pode parar o ciclo, tentar o reparo ou mandar a célula para a morte programada (apoptose). O gene Rb também controla a saída da fase G1.<br><div class='hy'><strong>Provas:</strong> Mutações no gene p53 são as alterações genéticas mais frequentes nos cânceres humanos. p53 e Rb são os protótipos de genes supressores de tumor. Os fármacos antimitóticos atuam na fase M do ciclo. Muitas células bem especializadas (neurônios e células do coração adulto) saem do ciclo e ficam em G0 permanentemente.</div>"},
{t:"Síntese Proteica: Transcrição e Tradução",s:"A informação genética flui do DNA para o RNA e depois para a proteína. Esse é o dogma central da biologia molecular.<br><br><strong>Transcrição</strong> acontece dentro do núcleo. A enzima RNA polimerase copia um trecho do DNA e produz uma molécula de RNA mensageiro (pré-mRNA). Esse pré-mRNA ainda precisa ser processado: recebe uma proteção na ponta inicial (cap), uma cauda de adeninas na ponta final e passa pelo splicing (os trechos que não codificam proteína – íntrons – são removidos e os trechos que codificam – éxons – são unidos). Depois de pronto, o mRNA sai do núcleo.<br><br><strong>Tradução</strong> acontece no citoplasma, nos ribossomos. O mRNA é lido de três em três letras (cada trio é um códon). Cada códon corresponde a um aminoácido específico. Os RNA transportadores (tRNA) trazem os aminoácidos corretos. O ribossomo vai montando a cadeia de aminoácidos até encontrar um códon de parada. Depois a proteína se dobra, pode receber modificações químicas e é enviada para o local onde vai atuar.<br><div class='hy'><strong>Provas:</strong> Vários antibióticos funcionam porque atrapalham a síntese de proteínas das bactérias (que têm ribossomos diferentes dos nossos). Aminoglicosídeos e tetraciclinas agem na subunidade menor; macrolídeos e cloranfenicol agem na subunidade maior. O código genético ser praticamente o mesmo em todos os seres vivos é uma forte evidência de que toda a vida na Terra tem uma origem comum.</div>"},
{t:"Junções Celulares e Comunicação entre Células",s:"As células dos tecidos não ficam isoladas: elas se aderem umas às outras e trocam sinais o tempo todo.<br><br><strong>Junções oclusivas</strong> (tight junctions) vedam o espaço entre células vizinhas, formando barreiras seletivas. São fundamentais no intestino e na barreira hematoencefálica.<br><br><strong>Junções de ancoragem</strong> (aderentes e desmossomos) dão resistência mecânica. Elas ligam o citoesqueleto de uma célula ao da célula vizinha, permitindo que o tecido aguente tração.<br><br><strong>Junções comunicantes</strong> (gap junctions) formam canais diretos entre o citoplasma de duas células. Através desses canais passam íons e pequenas moléculas. São essenciais para a sincronização elétrica do coração e do músculo liso.<br><br>Além das junções, as células se comunicam por sinais químicos. Os receptores podem ficar na membrana (receptores acoplados a proteína G, receptores tirosina-quinase) ou dentro da célula (receptores de hormônios esteroides). Quando o sinal chega, cascadas de segundos mensageiros (AMPc, cálcio, IP₃ etc.) amplificam e distribuem a informação dentro da célula.<br><div class='hy'><strong>Provas:</strong> Mutações nos genes das conexinas (proteínas das gap junctions) causam surdez congênita e algumas doenças de pele. As gap junctions são fundamentais para o coração bater de forma coordenada. A perda de moléculas de adesão (caderinas) facilita a invasão e a metástase dos tumores.</div>"}
]},

fisio:{d:"Fisiologia Humana",i:"❤️",r:"Guyton & Hall – Textbook of Medical Physiology; Ganong – Review of Medical Physiology; Boron & Boulpaep.",t:[
{t:"Homeostase e Sistemas de Controle",s:"Homeostase é a capacidade do organismo de manter o meio interno relativamente constante apesar das mudanças do ambiente externo. Quase todos os sistemas de controle do corpo funcionam por <strong>feedback negativo</strong>: quando uma variável se afasta do valor ideal, sensores detectam a mudança, um centro integrador processa a informação e efetores agem para trazer a variável de volta ao normal. Exemplos clássicos são o controle da pressão arterial pelos barorreceptores, o controle da glicemia pela insulina e pelo glucagon e o controle da temperatura pelo hipotálamo.<br><br>O feedback positivo é raro. Em vez de corrigir o desvio, ele o amplifica. Os exemplos mais importantes são as contrações uterinas durante o parto (mediadas pela ocitocina), a cascata da coagulação sanguínea e a abertura dos canais de sódio durante o potencial de ação.<br><br>As principais variáveis controladas com rigor pelo organismo são: temperatura corporal, pH do sangue, concentração de glicose, pressão arterial, osmolaridade do plasma, pressão parcial de oxigênio e de gás carbônico e as concentrações dos íons sódio, potássio e cálcio.<br><div class='hy'><strong>Alto rendimento:</strong> Falha dos mecanismos de homeostase está na base de doenças como diabetes mellitus, hipertensão arterial, choque e distúrbios ácido-base. Os barorreceptores do seio carotídeo e do arco aórtico e os quimiorreceptores são sensores clássicos cobrados em provas. O “set-point” de uma variável pode ser alterado (na febre o hipotálamo eleva a temperatura alvo).</div>"},
{t:"Sistema Nervoso – Potencial de Ação e Organização",s:"O sistema nervoso se divide em Sistema Nervoso Central (encéfalo e medula espinhal) e Sistema Nervoso Periférico (nervos cranianos, nervos espinhais e gânglios). O SNP tem uma divisão somática (controle voluntário dos músculos esqueléticos) e uma divisão autônoma (simpático – luta ou fuga; parassimpático – repouso e digestão).<br><br>No neurônio em repouso a membrana está polarizada cerca de –70 mV. Esse potencial de repouso depende principalmente da alta permeabilidade da membrana ao potássio e da ação da bomba Na⁺/K⁺. Quando um estímulo despolariza a membrana até um valor limiar, abrem-se canais de sódio voltagem-dependentes: o sódio entra em grande quantidade e a membrana se despolariza rapidamente (fase ascendente do potencial de ação). Em seguida os canais de sódio se inativam e abrem-se os canais de potássio: o potássio sai e a membrana se repolariza. Existe um período refratário durante o qual a célula não consegue disparar outro potencial de ação imediatamente.<br><br>Nas fibras nervosas mielinizadas o potencial de ação “salta” de um nódulo de Ranvier para o seguinte (condução saltatória), o que aumenta muito a velocidade de condução do impulso.<br><div class='hy'><strong>Provas:</strong> A esclerose múltipla é uma doença de desmielinização do sistema nervoso central. A síndrome de Guillain-Barré é uma desmielinização do sistema nervoso periférico. A miastenia gravis é causada por anticorpos contra o receptor nicotínico de acetilcolina na placa motora. Os anestésicos locais bloqueiam os canais de sódio voltagem-dependentes e impedem a geração e a condução do potencial de ação.</div>"},
{t:"Sistema Endócrino e Principais Eixos",s:"Os principais eixos hipotalâmico-hipofisários que você precisa dominar são:<br><br>• TRH (hipotálamo) → TSH (hipófise) → T3 e T4 (tireoide)<br>• CRH → ACTH → cortisol (córtex da adrenal)<br>• GnRH → LH e FSH → hormônios sexuais e gametogênese (gônadas)<br>• GHRH e somatostatina controlam a liberação de GH → IGF-1<br><br>O pâncreas endócrino produz insulina (células beta dos ilhotas de Langerhans) e glucagon (células alfa). A maior parte da regulação hormonal funciona por feedback negativo: o aumento do hormônio final inibe a liberação dos hormônios estimuladores “lá de cima” no eixo.<br><br>Os hormônios podem ser classificados em peptídicos/proteicos (agem em receptores de membrana e usam segundos mensageiros) e esteroides ou derivados de aminoácidos (muitos atravessam a membrana e agem em receptores nucleares, alterando a transcrição de genes).<br><div class='hy'><strong>Provas:</strong> No diabetes tipo 1 há destruição autoimune das células beta. No tipo 2 há resistência à insulina associada a deficiência relativa de secreção. No hipotireoidismo primário o TSH fica elevado. A síndrome de Cushing resulta de excesso de cortisol. O excesso de GH causa gigantismo (antes do fechamento das epífises) ou acromegalia (depois do fechamento).</div>"},
{t:"Sistema Cardiovascular – Coração, Débito e Pressão Arterial",s:"O débito cardíaco é o volume de sangue que o coração bombeia por minuto. Ele é igual à frequência cardíaca multiplicada pelo volume sistólico (volume ejetado a cada batimento). A pressão arterial média depende do débito cardíaco e da resistência periférica total que os vasos oferecem ao fluxo sanguíneo.<br><br>O volume sistólico é determinado por três fatores principais: a pré-carga (grau de enchimento do ventrículo no final da diástole – relacionado à Lei de Frank-Starling), a pós-carga (a resistência que o ventrículo precisa vencer para ejetar o sangue) e a contratilidade (a força intrínseca de contração do músculo cardíaco).<br><br>No curto prazo a pressão arterial é controlada principalmente pelos barorreceptores (seio carotídeo e arco aórtico) e pelo sistema nervoso autônomo. No médio e longo prazo entram em ação o sistema renina-angiotensina-aldosterona (SRAA), o hormônio antidiurético (ADH) e os peptídeos natriuréticos (ANP e BNP).<br><div class='hy'><strong>Provas:</strong> A Lei de Frank-Starling diz que, dentro de certos limites, quanto mais o coração se enche, mais forte ele contrai. Choque é a situação em que os tecidos não recebem perfusão adequada (pode ser hipovolêmico, cardiogênico, distributivo ou obstrutivo). O BNP elevado é um marcador importante de insuficiência cardíaca.</div>"},
{t:"Sistema Respiratório – Ventilação, Trocas e Transporte de Gases",s:"A inspiração é um processo ativo: o diafragma se contrai e desce, os intercostais externos se contraem e o volume da caixa torácica aumenta. Isso diminui a pressão intrapleural e o ar entra nos pulmões. A expiração em repouso é passiva (os músculos relaxam e a elasticidade do pulmão e da parede torácica expulsa o ar). Os volumes e capacidades pulmonares são avaliados pela espirometria.<br><br>As trocas de oxigênio e gás carbônico ocorrem nos alvéolos por difusão simples (Lei de Fick). O oxigênio é transportado no sangue principalmente ligado à hemoglobina (cerca de 98,5%); apenas uma pequena fração vai dissolvida no plasma. O gás carbônico é transportado principalmente na forma de bicarbonato (cerca de 70%), além de ligado à hemoglobina e dissolvido.<br><br>A curva de dissociação da hemoglobina tem forma sigmoide. Quando a curva se desloca para a direita, a hemoglobina libera o oxigênio com mais facilidade nos tecidos. Isso acontece com o aumento do CO₂, a diminuição do pH, o aumento da temperatura e o aumento do 2,3-BPG.<br><br>O centro respiratório localizado no bulbo é muito sensível às variações de CO₂ e de pH do líquido cefalorraquidiano. Os quimiorreceptores periféricos (corpos carotídeo e aórtico) respondem também à diminuição da pressão parcial de oxigênio.<br><div class='hy'><strong>Provas:</strong> O desvio da curva de dissociação da hemoglobina para a direita facilita a entrega de oxigênio aos tecidos. A espirometria diferencia padrões obstrutivos (relação VEF1/CVF diminuída) de padrões restritivos. Hipoxemia é a redução do oxigênio no sangue arterial; hipóxia é a redução da oferta de oxigênio aos tecidos.</div>"},
{t:"Sistema Digestório – Motilidade, Secreção e Absorção",s:"O tubo digestivo realiza quatro funções principais: motilidade, secreção, digestão e absorção. O controle é feito tanto pelo sistema nervoso (incluindo o sistema nervoso entérico) quanto por hormônios gastrointestinais (gastrina, secretina, colecistocinina, incretinas etc.).<br><br>No estômago as células parietais secretam ácido clorídrico (por meio da bomba H⁺/K⁺-ATPase) e fator intrínseco (essencial para a absorção de vitamina B12 no íleo terminal). O intestino delgado é o principal local de digestão final e de absorção de nutrientes; suas vilosidades e microvilosidades aumentam enormemente a superfície de contato. O fígado produz a bile (que emulsifica as gorduras), o pâncreas libera enzimas digestivas e bicarbonato, e a vesícula biliar armazena e concentra a bile.<br><div class='hy'><strong>Provas:</strong> A úlcera péptica está fortemente associada à infecção por Helicobacter pylori e ao uso de anti-inflamatórios não esteroides. A falta de fator intrínseco causa anemia perniciosa (deficiência de vitamina B12). O íleo terminal é o local de absorção da vitamina B12 e dos sais biliares. As incretinas (GLP-1 e GIP) amplificam a secreção de insulina após as refeições.</div>"},
{t:"Sistema Urinário e Fisiologia do Néfron",s:"Cada rim contém cerca de um milhão de néfrons, que são as unidades funcionais. Os processos fundamentais realizados pelo néfron são: filtração glomerular, reabsorção tubular, secreção tubular e excreção.<br><br>A taxa de filtração glomerular (TFG) normal fica em torno de 125 mL por minuto (cerca de 180 litros por dia). A barreira de filtração é formada pelo endotélio fenestrado dos capilares glomerulares, pela membrana basal e pelos pedicelos dos podócitos. O túbulo proximal reabsorve a maior parte do filtrado (glicose, aminoácidos, bicarbonato, sódio e água). A alça de Henle cria o gradiente de concentração da medula renal por meio do mecanismo de contracorrente. No túbulo distal e no ducto coletor a aldosterona regula a reabsorção de sódio e a secreção de potássio, enquanto o ADH (hormônio antidiurético) regula a reabsorção de água através da inserção de aquaporinas.<br><br>Além da função excretora, o rim produz eritropoietina, ativa a vitamina D (1α-hidroxilação) e libera renina (início do sistema renina-angiotensina-aldosterona).<br><div class='hy'><strong>Provas:</strong> A creatinina sérica é usada na prática clínica para estimar a TFG. Na insuficiência renal crônica aparecem hipercalemia, acidose metabólica, anemia (por falta de eritropoietina) e alterações do metabolismo de cálcio e fósforo. Os diuréticos de alça bloqueiam o cotransportador NKCC2 no ramo ascendente espesso da alça de Henle.</div>"},
{t:"Fisiologia do Músculo e Acoplamento Excitação-Contração",s:"Existem três tipos de músculo: esquelético (voluntário e estriado), cardíaco (involuntário e estriado, com discos intercalares) e liso (involuntário e sem estriações).<br><br>No músculo esquelético o potencial de ação chega à placa motora, provoca a liberação de acetilcolina, gera um potencial de ação na membrana da fibra muscular e esse potencial penetra para o interior da célula através dos túbulos T. A despolarização dos túbulos T provoca a liberação de cálcio do retículo sarcoplasmático. O cálcio se liga à troponina C, a tropomiosina se desloca e as cabeças de miosina podem se ligar à actina, formando as pontes cruzadas. O ciclo das pontes cruzadas (que consome ATP) produz o deslizamento dos filamentos e a contração. O relaxamento ocorre quando o cálcio é bombeado de volta para o retículo sarcoplasmático pela bomba SERCA.<br><div class='hy'><strong>Provas:</strong> O rigor mortis ocorre por falta de ATP (as pontes cruzadas não conseguem se desfazer). A distrofia muscular de Duchenne é causada pela ausência de distrofina. A unidade motora é formada por um neurônio motor e todas as fibras musculares que ele inerva. No músculo liso a regulação da contração envolve a calmodulina e a quinase da cadeia leve da miosina (MLCK).</div>"},
{t:"Equilíbrio Ácido-Base e Sistemas Tampão",s:"O pH do sangue arterial deve ser mantido entre 7,35 e 7,45. Os principais sistemas tampão do organismo são o sistema bicarbonato/ácido carbônico (o mais importante no líquido extracelular), o sistema fosfato, as proteínas plasmáticas e a hemoglobina.<br><br>O pulmão regula a pressão parcial de CO₂ de forma rápida, aumentando ou diminuindo a ventilação. O rim regula a concentração de bicarbonato e a excreção de íons hidrogênio de forma mais lenta, mas com grande capacidade. O rim reabsorve praticamente todo o bicarbonato filtrado, secreta H⁺ e produz amônia para eliminar a carga ácida diária.<br><br>Os distúrbios ácido-base podem ser de origem respiratória ou metabólica e se apresentam como acidose ou alcalose. A gasometria arterial é o exame fundamental para o diagnóstico e o acompanhamento. O cálculo do ânion gap ajuda a classificar as acidoses metabólicas em hipercloremicas (gap normal) ou com gap elevado.<br><div class='hy'><strong>Provas:</strong> A equação de Henderson-Hasselbalch relaciona o pH com a concentração de bicarbonato e a PaCO₂. Acidoses metabólicas com ânion gap elevado incluem cetoacidose diabética, acidose láctica, intoxicações (metanol, etilenoglicol) e insuficiência renal. Acidoses com gap normal incluem diarreia e acidose tubular renal.</div>"}
]},

{t:"Planos, Eixos e Termos de Posição Anatômica",s:"Toda descrição anatômica usa como referência a <strong>posição anatômica</strong>: a pessoa em pé, olhando para frente, braços ao longo do corpo com as palmas das mãos voltadas para frente e pés paralelos. Mesmo que o paciente esteja deitado ou em outra posição, as descrições continuam usando essa referência.<br><br><strong>Planos fundamentais:</strong><br>• Plano sagital: corta o corpo em direita e esquerda. O plano sagital mediano passa exatamente no meio.<br>• Plano coronal (ou frontal): corta o corpo em parte anterior (ventral) e parte posterior (dorsal).<br>• Plano transversal (ou axial/horizontal): corta o corpo em parte superior (cranial) e parte inferior (caudal).<br><br>Termos de relação importantes: medial (mais perto da linha média) e lateral (mais longe); proximal (mais perto do tronco) e distal (mais longe); superficial e profundo; ipsilateral (mesmo lado) e contralateral (lado oposto).<br><div class='hy'><strong>Provas:</strong> Todas as descrições em livros e laudos usam a posição anatômica. Os cortes de tomografia e ressonância são nomeados de acordo com esses planos. Movimentos básicos que você precisa dominar: flexão e extensão, abdução e adução, rotação medial e lateral, pronação e supinação.</div>"},
{t:"Sistema Esquelético e Articulações",s:"O esqueleto dá suporte, proteção e serve de alavanca para os músculos. Os ossos são classificados em longos (fêmur, úmero), curtos (ossos do carpo), planos (crânio, esterno), irregulares (vértebras) e sesamoides (patela). Todo osso tem uma parte compacta (cortical) mais densa e uma parte esponjosa (trabecular) com espaços.<br><br>No osso longo distinguimos: epífise (extremidades), diáfise (corpo) e metáfise (região entre elas, onde fica a cartilagem de crescimento na criança). Quando essa cartilagem se fecha, o crescimento em comprimento termina.<br><br><strong>Articulações</strong> são classificadas pelo grau de movimento e pelo tecido que as une:<br>• Fibrosas: quase não se mexem (suturas do crânio).<br>• Cartilaginosas: movimento limitado (discos intervertebrais, sínfise púbica).<br>• Sinoviais: bem móveis. Possuem cápsula, membrana sinovial, líquido sinovial e cartilagem hialina nas superfícies. Podem ter um, dois ou vários eixos de movimento.<br><div class='hy'><strong>Provas:</strong> Fratura do colo do fêmur é clássica em idosos com osteoporose e pode levar à necrose da cabeça do fêmur por lesão dos vasos. As articulações sinoviais são as mais acometidas por artrite reumatoide e osteoartrite. O fechamento da cartilagem de crescimento marca o fim do crescimento linear.</div>"},
{t:"Sistema Muscular",s:"Existem três tipos de músculo no corpo humano, com características bem diferentes:<br><br><strong>Músculo esquelético:</strong> voluntário, estriado, formado por fibras longas e multinucleadas com núcleos na periferia. É o músculo que move o esqueleto.<br><br><strong>Músculo cardíaco:</strong> involuntário, também estriado, mas as células são ramificadas e unidas por discos intercalares. Esses discos contêm junções comunicantes que permitem que o impulso elétrico passe rapidamente de uma célula para outra, fazendo o coração contrair de forma coordenada.<br><br><strong>Músculo liso:</strong> involuntário, sem estriações visíveis, células em forma de fuso com um único núcleo central. Está presente nas vísceras, nos vasos sanguíneos, nas vias aéreas e no olho.<br><br>A unidade contrátil do músculo estriado é o sarcômero, formado principalmente pelas proteínas actina e miosina. A unidade motora é composta por um neurônio motor e todas as fibras musculares que ele comanda.<br><div class='hy'><strong>Provas:</strong> Discos intercalares existem apenas no músculo cardíaco. O músculo liso contrai de forma mais lenta e sustentada. A hipertrofia muscular do adulto ocorre principalmente por aumento do tamanho das fibras já existentes, não por aumento significativo do número de fibras.</div>"},
{t:"Sistema Nervoso – Anatomia Macroscópica",s:"O sistema nervoso se divide em Sistema Nervoso Central (encéfalo + medula espinhal) e Sistema Nervoso Periférico (nervos cranianos, nervos espinhais e gânglios).<br><br>O encéfalo compreende o telencéfalo (hemisférios cerebrais), o diencéfalo (tálamo e hipotálamo), o tronco encefálico (mesencéfalo, ponte e bulbo) e o cerebelo. A medula espinhal desce pelo canal vertebral e dá origem aos nervos espinhais.<br><br>As meninges que protegem o SNC são três: dura-máter (mais externa e resistente), aracnoide e pia-máter (mais interna, aderida ao tecido nervoso). Entre a aracnoide e a pia fica o espaço subaracnóideo, preenchido por líquido cefalorraquidiano (LCR). O LCR é produzido nos plexos corioides, circula pelos ventrículos e pelo espaço subaracnóideo e é reabsorvido nas granulações aracnoides. A barreira hematoencefálica limita a passagem de substâncias do sangue para o tecido nervoso.<br><div class='hy'><strong>Provas:</strong> O nervo vago (X par craniano) é o principal nervo do sistema parassimpático. Lesão do nervo facial (VII) causa a paralisia de Bell. A punção lombar é feita no espaço subaracnóideo, geralmente entre as vértebras L3-L4 ou L4-L5 no adulto. Hérnia de disco intervertebral pode comprimir raízes nervosas e causar dor e déficits neurológicos.</div>"},
{t:"Coração e Grandes Vasos",s:"O coração fica no mediastino médio, dentro do saco pericárdico. Tem quatro câmaras: átrio direito, ventrículo direito, átrio esquerdo e ventrículo esquerdo. O sangue venoso chega ao átrio direito pelas veias cavas, passa pela valva tricúspide para o ventrículo direito e é bombeado para os pulmões pela artéria pulmonar. O sangue oxigenado volta pelas veias pulmonares ao átrio esquerdo, passa pela valva mitral para o ventrículo esquerdo e é ejetado para o corpo pela aorta.<br><br>As valvas atrioventriculares (tricúspide e mitral) impedem o refluxo para os átrios durante a sístole ventricular. As valvas semilunares (pulmonar e aórtica) impedem o refluxo para os ventrículos durante a diástole.<br><br>A irrigação do próprio músculo cardíaco é feita pelas artérias coronárias. A coronária esquerda se divide em ramo interventriculare anterior (descendente anterior – DA) e ramo circunflexo. A coronária direita irriga principalmente a parede inferior e parte do septo. O sistema de condução elétrico começa no nó sinoatrial (marcapasso natural), localizado perto da entrada da veia cava superior, e segue para o nó atrioventricular, feixe de His e fibras de Purkinje.<br><div class='hy'><strong>Provas:</strong> A artéria coronária mais frequentemente ocluída no infarto agudo do miocárdio é a descendente anterior. O nó sinoatrial é o marcapasso natural do coração. Um derrame pericárdico grande e rápido pode causar tamponamento cardíaco (compressão do coração pelo líquido acumulado).</div>"},
{t:"Sistema Respiratório – Anatomia",s:"As vias aéreas se dividem em superiores (nariz, faringe e laringe) e inferiores (traqueia, brônquios, bronquíolos e alvéolos). A traqueia se bifurca em dois brônquios principais. O brônquio principal direito é mais vertical, mais curto e mais largo que o esquerdo; por isso corpos estranhos aspirados tendem a se alojar mais à direita.<br><br>Os brônquios vão se dividindo em ramos cada vez menores até chegar aos bronquíolos e finalmente aos alvéolos, onde ocorrem as trocas gasosas. Cada pulmão é envolvido por duas folhas de pleura: a visceral (colada no pulmão) e a parietal (colada na parede torácica). Entre elas fica a cavidade pleural, com uma pequena quantidade de líquido e pressão negativa, o que mantém o pulmão expandido.<br><br>O principal músculo da inspiração é o diafragma. Os intercostais externos também ajudam. Na expiração forçada entram em ação os músculos abdominais e os intercostais internos.<br><div class='hy'><strong>Provas:</strong> Corpo estranho aspirado → caminho mais provável é o brônquio principal direito. Pneumotórax é a presença de ar na cavidade pleural, o que faz o pulmão colapsar. A carina (local da bifurcação traqueal) é um ponto de referência importante em procedimentos como intubação e broncoscopia.</div>"},
{t:"Sistema Digestório – Anatomia",s:"O tubo digestivo começa na boca e termina no ânus, passando por faringe, esôfago, estômago, intestino delgado (duodeno, jejuno e íleo) e intestino grosso (ceco, cólon ascendente, transverso, descendente, sigmoide e reto). O estômago tem regiões chamadas cárdia, fundo, corpo e antro/piloro.<br><br>As glândulas anexas são as salivares (parótida, submandibular e sublingual), o fígado, a vesícula biliar e o pâncreas. O fígado produz bile, que é armazenada e concentrada na vesícula e lançada no duodeno. O pâncreas lança suco pancreático rico em enzimas e bicarbonato também no duodeno.<br><br>O peritônio é a membrana que reveste a cavidade abdominal. Ele forma mesentérios (que prendem o intestino e trazem vasos e nervos) e omentos. Alguns órgãos ficam retroperitoneais (por trás do peritônio), como o pâncreas, os rins e grande parte do duodeno.<br><div class='hy'><strong>Provas:</strong> A irrigação do tubo digestivo vem principalmente do tronco celíaco (estômago, fígado, baço, duodeno proximal), da artéria mesentérica superior (intestino delgado e cólon direito) e da artéria mesentérica inferior (cólon esquerdo e reto superior). O íleo terminal é um local frequente de acometimento na doença de Crohn. O apêndice vermiforme se projeta no ponto de McBurney (importante no diagnóstico de apendicite).</div>"},
{t:"Sistemas Urinário e Reprodutor",s:"Os rins ficam na região retroperitoneal. O rim direito costuma ficar um pouco mais baixo por causa do espaço ocupado pelo fígado. Cada rim tem córtex (mais externo) e medula (organizada em pirâmides). A urina produzida nos néfrons escoa para a pelve renal, desce pelos ureteres, fica armazenada na bexiga e sai pela uretra. A uretra masculina é mais longa e atravessa a próstata e o pênis; a feminina é mais curta.<br><br>No aparelho genital masculino encontramos testículos (produção de espermatozoides e testosterona), epidídimos, ductos deferentes, vesículas seminais, próstata e pênis. No aparelho genital feminino encontramos ovários (produção de óvulos e hormônios), tubas uterinas (onde normalmente ocorre a fecundação), útero e vagina. Vários ligamentos (largo, redondo, ovariano, suspensor) mantêm os órgãos pélvicos na posição correta.<br><div class='hy'><strong>Provas:</strong> A uretra feminina mais curta contribui para a maior frequência de infecções urinárias em mulheres. A gravidez ectópica (fora do útero) ocorre com mais frequência na ampola da tuba uterina. A hiperplasia benigna da próstata comprime a uretra e causa sintomas de dificuldade para urinar em homens mais velhos.</div>"}
]},
histo:{d:"Histologia",i:"🔬",r:"Junqueira & Carneiro – Histologia Básica; Ross – Histology: A Text and Atlas; Wheater’s Functional Histology.",t:[
{t:"Tecido Epitelial",s:"O tecido epitelial é formado por células muito unidas umas às outras, com pouquíssima matriz entre elas. Elas se apoiam sobre uma lâmina basal e não possuem vasos sanguíneos próprios – a nutrição chega por difusão a partir do tecido conjuntivo subjacente. As células epiteliais têm polaridade: um lado apical (voltado para a luz ou para a superfície) e um lado basolateral (voltado para a base e para as células vizinhas). Elas se regeneram com facilidade.<br><br>A classificação dos epitélios considera o número de camadas e o formato das células da camada superficial:<br>• Simples (uma só camada) ou estratificado (várias camadas) ou ainda pseudoestratificado (parece estratificado mas todas as células tocam a base).<br>• Pavimentoso (achatado), cúbico ou cilíndrico (colunar).<br><br>Alguns epitélios têm especializações: cílios (vias respiratórias), microvilosidades (intestino – aumentam a superfície de absorção), queratina (pele) ou a capacidade de distensão (urotélio das vias urinárias).<br><div class='hy'><strong>Provas:</strong> O epitélio de transição (urotélio) reveste a bexiga e os ureteres e permite grande distensão. A metaplasia escamosa aparece nos brônquios de fumantes e no esôfago de Barrett (neste último é uma metaplasia intestinal). O endotélio que reveste vasos sanguíneos e linfáticos é um epitélio simples pavimentoso. O mesotélio reveste as cavidades serosas (pleura, pericárdio e peritônio).</div>"},
{t:"Tecido Conjuntivo",s:"O tecido conjuntivo é o mais abundante e variado do corpo. Ele é formado por células e por uma matriz extracelular que as células produzem. As células mais comuns são os fibroblastos (fabricam as fibras e a substância fundamental), os macrófagos (fagositam e apresentam antígenos), os mastócitos (liberam histamina e outros mediadores), os adipócitos (guardam gordura) e células de defesa que migram do sangue (linfócitos, plasmócitos, neutrófilos etc.).<br><br>A matriz tem duas partes: as fibras (colágeno, elastina e reticulina) e a substância fundamental (rica em proteoglicanos e glicoproteínas, que retém água e dá consistência). O colágeno tipo I é o mais abundante (osso, tendão, derme). O tipo II predomina na cartilagem. O tipo III forma as fibras reticulares. O tipo IV é típico da lâmina basal.<br><br>Há vários subtipos de tecido conjuntivo: frouxo, denso (modelado ou não modelado), adiposo, cartilaginoso, ósseo e o sangue (que é um tecido conjuntivo fluido).<br><div class='hy'><strong>Provas:</strong> A falta de vitamina C prejudica a hidroxilação do colágeno e causa escorbuto. A síndrome de Ehlers-Danlos e a osteogênese imperfeita são doenças genéticas que afetam o colágeno. O tecido adiposo marrom é rico em mitocôndrias e possui a proteína termogenina, que permite gerar calor em vez de ATP.</div>"},
{t:"Tecido Muscular",s:"O tecido muscular é especializado em contração. Existem três tipos histológicos com características bem distintas:<br><br><strong>Músculo esquelético:</strong> fibras longas e cilíndricas, com muitos núcleos localizados na periferia da célula. Apresenta estriações transversais bem visíveis (resultado da organização dos sarcômeros). É de controle voluntário.<br><br><strong>Músculo cardíaco:</strong> fibras também estriadas, mas ramificadas e unidas por discos intercalares. Os núcleos (um ou dois) ficam no centro da célula. Os discos intercalares contêm junções comunicantes (passagem de íons) e desmossomos (adesão mecânica). É de controle involuntário.<br><br><strong>Músculo liso:</strong> células fusiformes com um único núcleo central e sem estriações visíveis. A contração é mais lenta e pode ser mantida por longos períodos com pouco gasto de energia. É de controle involuntário e está presente nas vísceras ocas, nos vasos, nas vias aéreas e no olho.<br><div class='hy'><strong>Provas:</strong> Os discos intercalares são exclusivos do músculo cardíaco e permitem que o coração funcione como um “sincício elétrico”. O músculo liso não usa o sistema de troponina da mesma forma que o estriado; a regulação passa pela calmodulina e pela quinase da cadeia leve da miosina. A capacidade de regeneração do músculo esquelético é limitada (depende das células satélite); a do cardíaco é muito pobre no adulto.</div>"},
{t:"Tecido Nervoso",s:"O tecido nervoso é formado por neurônios e por células da glia. Os neurônios são as células que geram e transmitem os impulsos elétricos. Cada neurônio tem um corpo celular, dendritos (que recebem sinais) e um axônio (que leva o sinal para longe).<br><br>As células da glia dão suporte, nutrição, isolamento e defesa. No Sistema Nervoso Central temos:<br>• Astrócitos: sustentação, formação da barreira hematoencefálica e regulação do ambiente extracelular.<br>• Oligodendrócitos: produzem a bainha de mielina no SNC. Um único oligodendrócito pode mielinizar vários axônios.<br>• Microglia: são os macrófagos residentes do SNC.<br>• Células ependimárias: revestem os ventrículos e o canal central da medula.<br><br>No Sistema Nervoso Periférico a mielina é produzida pelas células de Schwann. Cada célula de Schwann envolve apenas um segmento de um único axônio.<br><div class='hy'><strong>Provas:</strong> Um oligodendrócito mieliniza vários axônios; uma célula de Schwann mieliniza apenas um segmento de um axônio. A barreira hematoencefálica é formada pelo endotélio dos capilares cerebrais (com junções oclusivas muito apertadas) mais os pés dos astrócitos. Quando um axônio é cortado, a parte distal sofre degeneração walleriana.</div>"},
{t:"Sangue e Hematopoiese",s:"O sangue é um tecido conjuntivo fluido composto por plasma (parte líquida) e elementos figurados (células e fragmentos celulares). Os elementos figurados são as hemácias (transporte de oxigênio), os leucócitos (defesa) e as plaquetas (fragmentos de megacariócitos que participam da coagulação).<br><br>Os leucócitos se dividem em: neutrófilos (os mais numerosos, primeira linha contra bactérias), linfócitos (imunidade específica – células B e T), monócitos (precursores dos macrófagos), eosinófilos (defesa contra parasitas e participação em alergias) e basófilos (semelhantes aos mastócitos, liberam histamina).<br><br>Todas essas células se originam na medula óssea a partir de células-tronco hematopoéticas. A produção é regulada por fatores de crescimento como a eritropoietina (produzida principalmente no rim), a trombopoetina e várias interleucinas e fatores estimuladores de colônias.<br><div class='hy'><strong>Provas:</strong> O neutrófilo é o leucócito mais abundante no sangue periférico e o primeiro a chegar em uma infecção bacteriana aguda. As plaquetas são fragmentos do citoplasma dos megacariócitos. A eritropoietina estimula a produção de hemácias e sua falta causa anemia na doença renal crônica. O aumento de formas jovens de neutrófilos (bastões) no sangue é chamado de desvio à esquerda e sugere infecção bacteriana aguda.</div>"},
{t:"Tecido Cartilaginoso e Ósseo",s:"A <strong>cartilagem</strong> é um tecido avascular (não tem vasos próprios). Os condrócitos ficam dentro de lacunas e recebem nutrição por difusão através da matriz. Existem três tipos principais: cartilagem hialina (a mais comum – articulações, vias aéreas, cartilagens de crescimento), cartilagem elástica (orelha, epiglote) e fibrocartilagem (discos intervertebrais, sínfise púbica).<br><br>O <strong>osso</strong> é vascularizado e fortemente mineralizado. Suas células são: osteoblastos (sintetizam a matriz orgânica), osteócitos (células maduras que ficam dentro de lacunas e mantêm o tecido) e osteoclastos (células multinucleadas que reabsorvem osso – originam-se da linhagem dos monócitos). O osso compacto é organizado em sistemas de Havers (ósteons); o osso esponjoso forma uma rede de trabéculas.<br><br>O crescimento dos ossos longos ocorre por ossificação endocondral (a partir de um molde de cartilagem). Alguns ossos chatos do crânio se formam por ossificação intramembranosa (diretamente a partir de membrana conjuntiva).<br><div class='hy'><strong>Provas:</strong> O paratormônio aumenta a reabsorção óssea (eleva o cálcio no sangue). A calcitonina inibe os osteoclastos. A vitamina D é essencial para a mineralização adequada do osso. A osteoporose é a perda de massa óssea que aumenta o risco de fraturas, especialmente em vértebras, fêmur e punho.</div>"}
]},
embrio:{d:"Embriologia",i:"🐣",r:"Moore – The Developing Human; Langman/Sadler – Medical Embryology; Carlson – Human Embryology.",t:[
{t:"Gametogênese e Fecundação",s:"A gametogênese é o processo de formação dos gametas (espermatozoides e óvulos). Ela envolve a meiose, que reduz o número de cromossomos pela metade (de 46 para 23) e cria variabilidade genética por dois mecanismos: o crossing-over (troca de pedaços entre cromossomos homólogos na prófase I) e a separação aleatória dos cromossomos maternos e paternos.<br><br>Na <strong>espermatogênese</strong> (que ocorre continuamente a partir da puberdade nos túbulos seminíferos) um espermatócito primário dá origem a quatro espermatozoides funcionais. Na <strong>ovogênese</strong> o processo começa ainda na vida fetal. Um ovócito primário dá origem a apenas um óvulo funcional e a corpúsculos polares (que degeneram). Os ovócitos ficam parados na prófase I da meiose até a ovulação e só terminam a meiose II se forem fecundados.<br><br>A <strong>fecundação</strong> normalmente ocorre na ampola da tuba uterina. O espermatozoide precisa passar pela capacitação e pela reação acrossômica para conseguir penetrar as camadas que envolvem o óvulo. A fecundação restaura o número diploide de cromossomos (46), determina o sexo genético da criança (XX ou XY) e ativa o óvulo para iniciar o desenvolvimento embrionário.<br><div class='hy'><strong>Provas:</strong> O crossing-over ocorre na prófase I da meiose. A idade materna avançada aumenta o risco de não-disjunção meiótica e, portanto, de trissomias (especialmente a trissomia do 21). A capacitação e a reação acrossômica são etapas obrigatórias para o espermatozoide conseguir fecundar o óvulo.</div>"},
{t:"Clivagem, Blastocisto e Implantação",s:"Depois da fecundação o zigoto começa a se dividir por mitoses sucessivas e rápidas. Essas divisões se chamam <strong>clivagem</strong>. Como não há aumento do volume total, as células filhas (blastômeros) ficam cada vez menores. Forma-se primeiro uma mórula (uma bola sólida de células) e depois o <strong>blastocisto</strong>, que já tem uma cavidade interna (blastocele), uma camada externa chamada trofoblasto e uma massa de células internas (embrioblasto) que vai formar o embrião propriamente dito.<br><br>Por volta do sexto ou sétimo dia após a fecundação o blastocisto começa a se implantar no endométrio (que está na fase secretora, preparado pela progesterona). O trofoblasto se diferencia em citotrofoblasto e sinciciotrofoblasto. O sinciciotrofoblasto invade o endométrio e passa a produzir o hormônio hCG, que mantém o corpo lúteo funcionando e, portanto, a produção de progesterona no início da gravidez. É o hCG que é detectado nos testes de gravidez.<br><div class='hy'><strong>Provas:</strong> O hCG é a base dos testes de gravidez (sangue ou urina). A gravidez ectópica (implantação fora do útero) ocorre com mais frequência na tuba uterina e é uma emergência médica. Muitas perdas gestacionais muito precoces acontecem por falha na implantação e a mulher nem chega a saber que estava grávida.</div>"},
{t:"Gastrulação e Formação dos Folhetos Germinativos",s:"Na terceira semana do desenvolvimento ocorre a <strong>gastrulação</strong>, um dos momentos mais importantes e delicados da embriogênese. A massa celular interna se reorganiza e forma os três folhetos germinativos definitivos, a partir dos quais todos os tecidos e órgãos do corpo serão derivados.<br><br>• O <strong>ectoderma</strong> dá origem à epiderme e seus anexos (pelos, unhas, glândulas), ao sistema nervoso central e periférico e à crista neural (que por sua vez origina gânglios, melanócitos, medula da adrenal e parte das estruturas da face).<br>• O <strong>mesoderma</strong> dá origem aos músculos, ossos, tecido conjuntivo, sistema cardiovascular, sistema urogenital, córtex da adrenal e membranas serosas.<br>• O <strong>endoderma</strong> dá origem ao revestimento do tubo digestivo e do tubo respiratório, bem como às glândulas anexas (fígado, pâncreas) e a órgãos como a tireoide e as paratireoides.<br><br>A gastrulação é um período de extrema sensibilidade a agentes teratógenos. Qualquer agressão nessa fase pode causar malformações graves ou a perda do embrião.<br><div class='hy'><strong>Provas:</strong> Todos os tecidos e órgãos do corpo humano derivam de apenas três folhetos germinativos. Defeitos na formação ou na migração da crista neural causam um espectro de malformações (por exemplo a síndrome de DiGeorge). A gastrulação é um dos períodos de maior risco para a ação de teratógenos.</div>"},
{t:"Neurulação e Organogênese",s:"A <strong>neurulação</strong> é o processo de formação do tubo neural, que dará origem a todo o sistema nervoso central. A notocorda induz o ectoderma sobrejacente a se transformar em placa neural. As bordas da placa se elevam formando a goteira neural e depois se fecham formando o tubo neural. O fechamento completo ocorre por volta do final da quarta semana. As células da crista neural se destacam das bordas do tubo e migram para várias regiões do corpo, originando estruturas muito diversas.<br><br>O período embrionário (da terceira até a oitava semana) é o período da <strong>organogênese</strong>: neles se formam os primórdios de praticamente todos os órgãos. Depois da oitava semana começa o período fetal, caracterizado principalmente por crescimento e maturação funcional dos órgãos já formados.<br><div class='hy'><strong>Provas:</strong> Os defeitos de fechamento do tubo neural (anencefalia, espinha bífida, encefalocele) podem ser em grande parte prevenidos pela suplementação de ácido fólico no período periconcepcional (antes de engravidar e nas primeiras semanas). O período mais crítico para a ação de teratógenos é da terceira à oitava semana. A notocorda, além de induzir a neurulação, contribui para a formação do núcleo pulposo dos discos intervertebrais.</div>"},
{t:"Anexos Embrionários e Placenta",s:"Durante o desenvolvimento formam-se estruturas anexas que não farão parte do corpo do bebê, mas são essenciais para sua proteção e nutrição:<br><br>• O <strong>âmnio</strong> forma uma bolsa cheia de líquido que protege o embrião/feto de traumas e permite movimentos.<br>• O <strong>saco vitelínico</strong> participa da hematopoiese inicial e é a origem das células germinativas primordiais.<br>• O <strong>alantoide</strong> contribui para a formação do cordão umbilical e da bexiga.<br>• O <strong>córion</strong> e a <strong>placenta</strong> fazem a interface com o organismo materno.<br><br>A placenta permite a troca de gases, nutrientes e resíduos entre o sangue materno e o sangue fetal (sem que os dois sangues se misturem diretamente). Ela também funciona como órgão endócrino, produzindo hCG, progesterona, estrógenos e hormônio lactogênico placentário. A circulação fetal possui três desvios importantes (shunts): o forame oval, o canal arterial (ducto arterioso) e o ducto venoso. Esses desvios permitem que o sangue mais oxigenado seja direcionado prioritariamente para o cérebro e o coração do feto.<br><div class='hy'><strong>Provas:</strong> Depois do nascimento os shunts devem se fechar. A persistência do canal arterial e a permanência do forame oval são condições clínicas importantes. A placenta também atua como uma barreira (embora imperfeita) contra alguns microrganismos e fármacos.</div>"},
{t:"Teratologia e Períodos Críticos do Desenvolvimento",s:"Teratógenos são agentes capazes de causar malformações congênitas. Podem ser fármacos, drogas, infecções, alterações metabólicas da mãe (como diabetes descompensado), radiação ou fatores mecânicos. O efeito de um teratógeno depende da natureza do agente, da dose, da duração da exposição e, principalmente, do momento do desenvolvimento em que a exposição ocorre.<br><br>Antes da implantação o embrião é relativamente resistente (o efeito costuma ser “tudo ou nada”: ou o embrião morre ou ele segue aparentemente normal). O período de maior risco para malformações estruturais graves é o da gastrulação e da organogênese (terceira à oitava semana). No período fetal as agressões tendem a causar mais problemas de crescimento e de maturação funcional do que malformações grosseiras.<br><br>Exemplos clássicos de teratógenos: álcool (síndrome alcoólica fetal), isotretinoína, talidomida, warfarina, ácido valproico, algumas infecções do grupo TORCH (toxoplasmose, sífilis, rubéola, citomegalovírus, herpes) e o diabetes materno mal controlado.<br><div class='hy'><strong>Provas:</strong> A suplementação de ácido fólico antes e no início da gestação reduz significativamente o risco de defeitos do tubo neural. A rubéola congênita clássica cursa com catarata, cardiopatia e surdez. Sempre se deve perguntar, no pré-natal, sobre uso de medicamentos, drogas, infecções e doenças crônicas da mãe.</div>"}
]},

gen:{d:"Genética",i:"🧬",r:"Thompson & Thompson Genetics in Medicine; Nussbaum – Thompson & Thompson; Griffiths – Introduction to Genetic Analysis; Strachan – Human Molecular Genetics.",t:[
{t:"Estrutura do DNA, Genes e Genoma Humano",s:"O DNA (ácido desoxirribonucleico) é a molécula que guarda a informação genética de todos os seres vivos. Ele é formado por duas fitas que se enrolam uma na outra formando a clássica <strong>dupla hélice</strong>. Cada fita é uma sequência de nucleotídeos. Cada nucleotídeo tem três partes: um açúcar (desoxirribose), um grupo fosfato e uma base nitrogenada. As bases são: Adenina (A), Timina (T), Citosina (C) e Guanina (G). A Adenina sempre emparelha com a Timina (duas pontes de hidrogênio) e a Citosina sempre emparelha com a Guanina (três pontes de hidrogênio). As duas fitas são antiparalelas (uma corre no sentido 5’→3’ e a outra no sentido 3’→5’).<br><br>Um <strong>gene</strong> é um trecho de DNA que contém a informação necessária para produzir uma molécula funcional (na maioria das vezes uma proteína, mas também RNAs funcionais). O <strong>genoma</strong> humano tem cerca de 3,2 bilhões de pares de bases e aproximadamente 20.000 a 22.000 genes que codificam proteínas. Surpreendentemente, apenas cerca de 1,5% do genoma codifica proteínas; o restante inclui sequências reguladoras, RNAs não codificantes e DNA repetitivo.<br><br>O DNA está organizado em cromossomos. Nas células somáticas humanas existem 46 cromossomos (23 pares): 22 pares de autossomos e 1 par de cromossomos sexuais (XX na mulher e XY no homem).<br><div class='hy'><strong>Provas:</strong> O projeto Genoma Humano mostrou que temos muito menos genes do que se imaginava. Mutações em regiões reguladoras (promotores, enhancers) também podem causar doenças, mesmo sem alterar a sequência da proteína. O DNA mitocondrial é circular, tem apenas 37 genes e é herdado exclusivamente da mãe.</div>"},
{t:"Replicação, Transcrição e Tradução",s:"A <strong>replicação</strong> do DNA ocorre na fase S do ciclo celular. Ela é semiconservativa: cada fita antiga serve de molde para uma fita nova. A enzima principal é a DNA polimerase, que só consegue adicionar nucleotídeos no sentido 5’→3’. Por isso uma das fitas é sintetizada de forma contínua (fita líder) e a outra é sintetizada em pedaços (fragmentos de Okazaki – fita retardada). A helicase abre a dupla hélice, a primase coloca primers de RNA e a DNA ligase une os fragmentos.<br><br>A <strong>transcrição</strong> é a síntese de RNA a partir de um molde de DNA. A RNA polimerase lê a fita molde e produz uma molécula de RNA mensageiro (pré-mRNA). No núcleo o pré-mRNA sofre processamento: recebe um “cap” na extremidade 5’, uma cauda poli-A na extremidade 3’ e passa pelo splicing (remoção dos íntrons e união dos éxons).<br><br>A <strong>tradução</strong> ocorre nos ribossomos. O mRNA é lido em grupos de três bases (códons). Cada códon corresponde a um aminoácido (ou a um sinal de parada). Os RNA transportadores (tRNA) trazem os aminoácidos corretos. O código genético é degenerado (vários códons podem codificar o mesmo aminoácido) e praticamente universal.<br><div class='hy'><strong>Provas:</strong> Vários antibióticos inibem a síntese proteica bacteriana porque os ribossomos bacterianos (70S) são diferentes dos eucarióticos (80S). Mutações frameshift (inserção ou deleção que não é múltipla de 3) alteram toda a sequência de aminoácidos a partir daquele ponto e costumam ser muito graves. O splicing alternativo permite que um único gene produza várias proteínas diferentes.</div>"},
{t:"Mutações e Polimorfismos",s:"Mutação é qualquer mudança permanente na sequência do DNA. As mutações podem ser classificadas de várias formas:<br><br><strong>Quanto à extensão:</strong><br>• Mutações pontuais (troca de uma única base)<br>• Pequenas inserções ou deleções<br>• Grandes rearranjos (deleções, duplicações, inversões, translocações)<br><br><strong>Quanto ao efeito na proteína (mutações pontuais):</strong><br>• Silenciosa: troca a base mas não muda o aminoácido<br>• Missense: troca um aminoácido por outro<br>• Nonsense: transforma um códon de aminoácido em códon de parada (proteína truncada)<br>• Frameshift: desloca a fase de leitura<br><br>Polimorfismos são variações comuns na população (frequência maior que 1%). O tipo mais frequente são os SNPs (single nucleotide polymorphisms). Nem toda mutação causa doença; muitas são neutras ou até benéficas.<br><br>Agentes mutagênicos incluem radiação ionizante, radiação ultravioleta, alguns produtos químicos e erros da própria maquinaria de replicação e reparo do DNA.<br><div class='hy'><strong>Provas:</strong> A anemia falciforme é causada por uma mutação missense clássica (Glu6Val na cadeia beta da hemoglobina). A fibrose cística tem centenas de mutações possíveis no gene CFTR; a mais comum é a ΔF508 (deleção de três bases). Mutações nonsense e frameshift costumam ser mais graves que missense. O xeroderma pigmentoso resulta de defeito no reparo de DNA danificado por UV.</div>"},
{t:"Padrões de Herança Mendeliana",s:"Os padrões clássicos de herança são:<br><br><strong>Autossômica dominante:</strong> basta uma cópia mutada do gene para a doença se manifestar. Afeta homens e mulheres na mesma proporção. Há transmissão vertical (aparece em todas as gerações). Exemplos: doença de Huntington, acondroplasia, neurofibromatose tipo 1, hipercolesterolemia familiar, Marfan.<br><br><strong>Autossômica recessiva:</strong> só manifesta a doença quem tem as duas cópias mutadas. Os pais são geralmente portadores assintomáticos. Há risco de 25% em cada gestação quando os dois pais são portadores. Exemplos: fibrose cística, anemia falciforme, fenilcetonúria, doença de Tay-Sachs, a maioria das erros inatos do metabolismo.<br><br><strong>Ligada ao X recessiva:</strong> o gene está no cromossomo X. Homens (que têm só um X) manifestam a doença se herdarem o X mutado da mãe. Mulheres precisam de duas cópias mutadas para serem afetadas (raro). Não há transmissão de homem para homem. Exemplos: hemofilia A e B, daltonismo, distrofia muscular de Duchenne, deficiência de G6PD.<br><br><strong>Ligada ao X dominante:</strong> mais rara. Mulheres afetadas transmitem a doença para 50% dos filhos de ambos os sexos; homens afetados transmitem para todas as filhas e nenhum filho. Exemplos: síndrome do X frágil (na verdade tem mecanismo mais complexo), hipofosfatemia ligada ao X.<br><br><strong>Herança mitocondrial:</strong> só a mãe transmite (o espermatozoide praticamente não contribui com mitocôndrias). Todos os filhos de uma mulher afetada podem herdar a mutação. Exemplos: neuropatia óptica de Leber, síndrome de MELAS, MERRF.<br><div class='hy'><strong>Provas:</strong> Em questões de hereditariedade, sempre monte o heredograma mentalmente. Doenças ligadas ao X recessivas quase nunca são transmitidas de pai para filho homem. A penetração incompleta e a expressividade variável são comuns em doenças autossômicas dominantes e podem confundir o padrão no heredograma.</div>"},
{t:"Citogenética – Cromossomos e Aberrações",s:"A citogenética estuda os cromossomos. O cariótipo humano normal é 46,XX (mulher) ou 46,XY (homem). Os cromossomos são classificados pelo tamanho e pela posição do centrômero (metacêntricos, submetacêntricos e acrocêntricos).<br><br><strong>Aberrações numéricas:</strong><br>• Trissomias: presença de um cromossomo a mais. As compatíveis com a vida são a trissomia do 21 (síndrome de Down), do 18 (Edwards) e do 13 (Patau). Também existem as dos cromossomos sexuais: XXY (Klinefelter), XYY, XXX e a monossomia X (Turner – 45,X).<br>• As trissomias autossômicas aumentam de frequência com a idade materna avançada (principalmente por não-disjunção na meiose I materna).<br><br><strong>Aberrações estruturais:</strong> deleções, duplicações, inversões, translocações (equilibradas ou desequilibradas) e cromossomos em anel. Translocações equilibradas nos pais podem gerar prole com desequilíbrio cromossômico.<br><br>O exame de cariótipo clássico ainda é muito usado, mas hoje também se utilizam técnicas como FISH, MLPA e arrays de CGH e, cada vez mais, sequenciamento.<br><div class='hy'><strong>Provas:</strong> Síndrome de Down (47,XX,+21 ou 47,XY,+21) – deficiência intelectual, face característica, prega simiesca, risco aumentado de cardiopatia, Alzheimer precoce e leucemia. Síndrome de Turner (45,X) – fenótipo feminino, baixa estatura, pescoço alado, amenorreia primária, infertilidade. Síndrome de Klinefelter (47,XXY) – fenótipo masculino, alta estatura, hipogonadismo, infertilidade.</div>"},
{t:"Genética Molecular e Diagnóstico",s:"As principais técnicas usadas no diagnóstico genético atual incluem:<br><br>• <strong>PCR</strong> (Reação em Cadeia da Polimerase): amplifica milhões de vezes um trecho específico de DNA. É a base de muitos testes.<br>• <strong>Sequenciamento de Sanger</strong>: ainda o padrão-ouro para sequenciar genes específicos.<br>• <strong>Sequenciamento de Nova Geração (NGS)</strong>: permite sequenciar painéis de genes, o exoma inteiro ou até o genoma inteiro de uma vez.<br>• <strong>FISH</strong> (Hibridização in situ Fluorescente): detecta alterações cromossômicas específicas com sondas fluorescentes.<br>• <strong>MLPA</strong> e <strong>CGH-array</strong>: excelentes para detectar deleções e duplicações de tamanho intermediário.<br><br>O aconselhamento genético é o processo de comunicação que ajuda o paciente e a família a entenderem o diagnóstico, o risco de recorrência, as opções reprodutivas e as possibilidades de tratamento ou prevenção.<br><div class='hy'><strong>Provas:</strong> O teste de triagem neonatal (teste do pezinho) detecta várias doenças genéticas e metabólicas em fase pré-sintomática. A biópsia de vilo corial e a amniocentese permitem o diagnóstico pré-natal. O diagnóstico pré-implantacional (DPI) pode ser feito em embriões gerados por fertilização in vitro. Variantes de significado incerto (VUS) são um desafio crescente nos laudos de NGS.</div>"},
{t:"Epigenética e Regulação da Expressão Gênica",s:"Epigenética são as modificações que alteram a atividade dos genes sem mudar a sequência do DNA. Os principais mecanismos são:<br><br>• <strong>Metilação do DNA</strong> (geralmente em ilhas CpG): associada a silenciamento de genes.<br>• <strong>Modificações de histonas</strong> (acetilação, metilação, fosforilação etc.): podem abrir ou fechar a cromatina.<br>• <strong>RNAs não codificantes</strong> (microRNAs, lncRNAs): regulam a estabilidade e a tradução dos mRNAs.<br><br>A imprinting genômico é um fenômeno epigenético em que certos genes são expressos de forma diferente conforme tenham sido herdados do pai ou da mãe. Os exemplos clássicos são as síndromes de Prader-Willi e Angelman (ambas envolvem a mesma região do cromossomo 15, mas o quadro clínico depende de qual dos pais contribuiu com a alteração).<br><br>A inativação do cromossomo X nas mulheres (hipótese de Lyon) também é um processo epigenético: um dos X é silenciado de forma aleatória em cada célula e forma o corpúsculo de Barr.<br><div class='hy'><strong>Provas:</strong> Prader-Willi (falta do gene paterno na região 15q11-13) – hipotonia, hiperfagia, obesidade. Angelman (falta do gene materno na mesma região) – riso inapropriado, ataxia, deficiência intelectual grave. A inativação do X explica por que mulheres heterozigotas para doenças ligadas ao X podem ter expressão clínica variável (mosaicismo funcional).</div>"},
{t:"Genética do Câncer e Oncogenética",s:"O câncer é, em última análise, uma doença genética das células somáticas. Ocorrem mutações e alterações epigenéticas que conferem às células as características de malignidade (os “hallmarks” do câncer).<br><br>Os principais tipos de genes envolvidos são:<br>• <strong>Proto-oncogenes</strong>: quando mutados ou superativados viram oncogenes (ganho de função). Exemplos: RAS, MYC, HER2/ERBB2, BCR-ABL.<br>• <strong>Genes supressores de tumor</strong>: precisam perder a função das duas cópias (duas “batidas”). Exemplos clássicos: TP53 (o “guardião do genoma”), RB1, BRCA1 e BRCA2, APC, VHL.<br>• <strong>Genes de reparo do DNA</strong>: quando deficientes, aumentam a taxa de mutações (ex.: genes da síndrome de Lynch – MLH1, MSH2 etc.; genes do xeroderma pigmentoso).<br><br>A maioria dos cânceres é esporádica (mutações adquiridas ao longo da vida). Uma minoria é hereditária (a pessoa já nasce com uma mutação germinativa que aumenta muito o risco). Exemplos de síndromes de predisposição: câncer de mama e ovário hereditário (BRCA1/2), síndrome de Lynch (câncer colorretal e outros), Li-Fraumeni (TP53), polipose adenomatosa familiar (APC).<br><div class='hy'><strong>Provas:</strong> TP53 é o gene mais frequentemente mutado nos cânceres humanos. BRCA1 e BRCA2 aumentam muito o risco de câncer de mama e de ovário e também se associam a câncer de próstata e pâncreas. A síndrome de Lynch é a causa mais comum de câncer colorretal hereditário e se deve a defeito no sistema de reparo de mismatches. O conceito de “duas batidas” de Knudson foi formulado a partir do retinoblastoma.</div>"}
]},

{t:"Células e Órgãos do Sistema Imune",s:"O sistema imune possui órgãos linfoides primários e secundários. Os <strong>primários</strong> são a medula óssea (onde nascem todas as células sanguíneas e onde os linfócitos B amadurecem) e o timo (onde os linfócitos T amadurecem e passam pela seleção positiva e negativa). Os <strong>secundários</strong> são os locais onde os linfócitos encontram os antígenos e são ativados: linfonodos, baço e o tecido linfoide associado às mucosas (MALT – tonsilas, placas de Peyer, apêndice etc.).<br><br>As principais células envolvidas na defesa são:<br>• Linfócitos B (produzem anticorpos quando se diferenciam em plasmócitos).<br>• Linfócitos T CD4 (auxiliares – coordenam a resposta) e T CD8 (citotóxicos – matam células infectadas ou alteradas).<br>• Células NK (matam células infectadas por vírus e células tumorais de forma inata).<br>• Células dendríticas (as melhores apresentadoras de antígeno para ativar linfócitos T virgens).<br>• Macrófagos e monócitos (fagositose e apresentação de antígenos).<br>• Neutrófilos (primeira linha contra bactérias).<br>• Eosinófilos, basófilos e mastócitos (participam de respostas alérgicas e contra parasitas).<br><div class='hy'><strong>Provas:</strong> As células dendríticas são as apresentadoras de antígeno mais eficientes para iniciar uma resposta de linfócitos T virgens. Pessoas sem baço (asplenia) têm risco aumentado de infecções graves por bactérias encapsuladas (pneumococo, meningococo e Haemophilus influenzae) e devem ser vacinadas. O timo regride após a puberdade (involução tímica), mas ainda mantém alguma função residual.</div>"},
{t:"Imunidade Inata",s:"A imunidade inata é a primeira linha de defesa. Ela age de forma rápida (minutos a poucas horas) e de maneira inespecífica – reconhece padrões gerais de microrganismos, não antígenos específicos. Não gera memória imunológica clássica da mesma forma que a imunidade adaptativa.<br><br>Seus componentes incluem:<br>• Barreiras físicas e químicas (pele íntegra, mucosas, pH ácido do estômago, enzimas como a lisozima, defensinas).<br>• Células: neutrófilos, macrófagos, células NK e células dendríticas.<br>• Sistema complemento (um conjunto de proteínas plasmáticas que se ativam em cascata).<br>• Citocinas e quimiocinas da inflamação.<br><br>As células da imunidade inata reconhecem estruturas conservadas dos microrganismos (PAMPs – padrões moleculares associados a patógenos) e sinais de dano celular (DAMPs) através de receptores de reconhecimento de padrões, especialmente os TLRs (Toll-like receptors).<br><br>O sistema complemento pode ser ativado por três vias (clássica, alternativa e das lectinas). Todas convergem para a formação da C3 convertase e depois levam à opsonização (marcação para fagocitose), inflamação e formação do Complexo de Ataque à Membrana (MAC), que fura a membrana do invasor.<br><div class='hy'><strong>Provas:</strong> Deficiência de C3 causa infecções piogênicas graves e de repetição. Deficiência dos componentes finais do MAC (C5 a C9) predispõe especialmente a infecções por Neisseria (meningococo e gonococo). Os neutrófilos são a primeira célula a chegar em grande número em uma infecção bacteriana aguda.</div>"},
{t:"Imunidade Adaptativa – Humoral e Celular",s:"A imunidade adaptativa é específica (reconhece antígenos particulares) e possui memória. Ela demora alguns dias para atingir a plena resposta na primeira exposição, mas na segunda exposição ao mesmo antígeno a resposta é muito mais rápida e intensa.<br><br><strong>Imunidade humoral:</strong> mediada pelos linfócitos B e pelos anticorpos que eles produzem. Quando ativado, o linfócito B se diferencia em plasmócito (que secreta grandes quantidades de anticorpo) e também gera células de memória. As classes de imunoglobulinas são: IgM (primeira a aparecer, forma de pentâmero, ativa bem o complemento), IgG (mais abundante no sangue, atravessa a placenta e protege o bebê), IgA (principal nas mucosas e no leite materno), IgE (envolvida em alergias e na defesa contra helmintos) e IgD (funciona principalmente como receptor na superfície dos linfócitos B virgens).<br><br><strong>Imunidade celular:</strong> mediada pelos linfócitos T. Os T CD4 (auxiliares) se diferenciam em subtipos (Th1, Th2, Th17, Treg etc.) e coordenam diferentes tipos de resposta. Os T CD8 (citotóxicos) reconhecem células infectadas ou tumorais e as matam. O reconhecimento pelos linfócitos T é restrito ao MHC: moléculas de MHC de classe I (presentes em praticamente todas as células nucleadas) apresentam antígenos para os T CD8; moléculas de MHC de classe II (presentes em células apresentadoras de antígeno profissionais) apresentam antígenos para os T CD4.<br><div class='hy'><strong>Provas:</strong> Na resposta primária predomina a IgM; na resposta secundária (memória) predomina a IgG. A hipersensibilidade do tipo I (alergia imediata) é mediada por IgE. O HIV infecta preferencialmente os linfócitos T CD4, destruindo a coordenação da resposta imune. As vacinas funcionam justamente porque geram memória imunológica adaptativa.</div>"},
{t:"Hipersensibilidade e Autoimunidade",s:"As reações de hipersensibilidade são respostas imunes exageradas ou inadequadas que causam dano ao próprio organismo. A classificação clássica de Gell e Coombs divide em quatro tipos:<br><br>• <strong>Tipo I (imediata):</strong> mediada por IgE ligada a mastócitos e basófilos. Exemplos: anafilaxia, asma alérgica, rinite alérgica, urticária.<br>• <strong>Tipo II (citotóxica):</strong> mediada por anticorpos IgG ou IgM contra antígenos presentes na superfície de células ou de estruturas teciduais. Exemplos: anemia hemolítica autoimune, síndrome de Goodpasture, miastenia gravis, doença de Graves.<br>• <strong>Tipo III (imunocomplexos):</strong> deposição de complexos antígeno-anticorpo em tecidos, ativando complemento e inflamação. Exemplos: lúpus eritematoso sistêmico (LES), doença do soro, algumas glomerulonefrites.<br>• <strong>Tipo IV (tardia ou celular):</strong> mediada por linfócitos T. Exemplos: teste tuberculínico (PPD), dermatite de contato, rejeição de enxertos, algumas formas de diabetes tipo 1 e de esclerose múltipla.<br><br>A autoimunidade ocorre quando o sistema imune perde a tolerância aos antígenos próprios e passa a atacar o organismo.<br><div class='hy'><strong>Provas:</strong> O tratamento de primeira linha da anafilaxia é a adrenalina intramuscular. O LES é o protótipo de doença por imunocomplexos (tipo III) e também apresenta autoanticorpos. Diabetes mellitus tipo 1 e tireoidite de Hashimoto são exemplos clássicos de autoimunidade órgão-específica.</div>"},
{t:"Vacinas e Memória Imunológica",s:"Existem duas formas principais de imunização:<br><br>• <strong>Ativa:</strong> a própria pessoa entra em contato com o antígeno (por infecção natural ou por vacina) e monta sua própria resposta imune, gerando memória. É a forma mais duradoura de proteção.<br>• <strong>Passiva:</strong> a pessoa recebe anticorpos prontos (soro hiperimune, imunoglobulina ou anticorpos transferidos da mãe pela placenta ou pelo leite). A proteção é imediata, mas temporária, porque não gera memória própria.<br><br>As vacinas podem ser de vários tipos: vírus ou bactérias vivos atenuados, inativados (mortos), toxoides (toxinas inativadas), subunidades, conjugadas, de vetor viral ou de ácido nucleico (mRNA ou DNA). Cada tipo tem vantagens e limitações específicas.<br><br>Na primeira exposição ao antígeno a resposta é mais lenta e predomina a IgM (resposta primária). Nas exposições seguintes a resposta é muito mais rápida, intensa e predomina a IgG (resposta secundária ou de memória).<br><div class='hy'><strong>Provas:</strong> Vacinas de microrganismos vivos atenuados em geral são contraindicadas em pessoas com imunodeficiência grave e em gestantes. A memória imunológica é a base biológica do sucesso das vacinas e da necessidade de doses de reforço em algumas delas. Adjuvantes são substâncias adicionadas a algumas vacinas para aumentar a resposta imune.</div>"},
{t:"Tolerância Imunológica e Imunodeficiências",s:"A tolerância imunológica é o estado de não-reatividade do sistema imune a determinados antígenos, especialmente aos antígenos do próprio organismo. Sem tolerância, teríamos autoimunidade constante.<br><br>A tolerância pode ser <strong>central</strong> (ocorre durante a maturação dos linfócitos no timo e na medula óssea, eliminando ou inativando as células fortemente autorreativas) ou <strong>periférica</strong> (ocorre nos tecidos periféricos por mecanismos como anergia, deleção, supressão por células T reguladoras ou simplesmente ignorância imunológica).<br><br>As células T reguladoras (Tregs – caracterizadas por CD4+ CD25+ FoxP3+) e citocinas anti-inflamatórias como IL-10 e TGF-β são fundamentais para manter a tolerância e evitar respostas excessivas.<br><br>As imunodeficiências podem ser <strong>primárias</strong> (genéticas, como as imunodeficiências combinadas graves – SCID, a doença granulomatosa crônica, defeitos de produção de anticorpos ou de complemento) ou <strong>secundárias</strong> (adquiridas – HIV/AIDS, uso de imunossupressores, desnutrição, certos cânceres, diabetes descompensado etc.).<br><div class='hy'><strong>Provas:</strong> A falha dos mecanismos de tolerância é a base das doenças autoimunes. A ausência de Tregs funcionantes causa uma doença autoimune grave chamada IPEX. No HIV a destruição progressiva dos linfócitos T CD4 leva à imunodeficiência adquirida. Vacinas de vírus vivos são contraindicadas nas imunodeficiências combinadas graves.</div>"}
]},
