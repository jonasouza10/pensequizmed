<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PenseQuizMed Semiologia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#0b1120;--card:#1e293b;--side:#0f172a;--bd:#334155;--tx:#e2e8f0;--mu:#94a3b8;--ac:#14b8a6;--acs:rgba(20,184,166,.12);--ye:#fbbf24;--success:#22c55e;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f1f5f9;--card:#fff;--side:#0f172a;--bd:#e2e8f0;--tx:#1e293b;--mu:#64748b;--acs:rgba(13,148,136,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
.side{width:280px;background:var(--side);border-right:1px solid var(--bd);position:fixed;height:100vh;display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.hd{padding:1.2rem;background:linear-gradient(135deg,#0d9488,#0f766e)}
.hd h1{color:#fff;font-size:1.1rem}
.hd p{color:rgba(255,255,255,.85);font-size:.72rem;margin-top:.25rem}
.sb{padding:.7rem;border-bottom:1px solid rgba(255,255,255,.08)}
.sb input{width:100%;padding:.55rem .8rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;outline:none;font-size:.88rem}
.sb input::placeholder{color:rgba(255,255,255,.45)}
.nv{flex:1;overflow-y:auto;padding:.4rem 0}
.ni{display:block;width:100%;text-align:left;padding:.6rem 1rem;background:0;border:0;color:#94a3b8;font-size:.88rem;cursor:pointer;border-left:3px solid transparent;transition:.15s}
.ni:hover,.ni.on{background:rgba(20,184,166,.15);color:#5eead4}
.ni.on{border-left-color:#14b8a6;font-weight:600}
.mn{margin-left:280px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.tb{padding:.85rem 1.3rem;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:50}
.tb h2{font-size:1.15rem}
.btns{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{padding:.4rem .85rem;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:.8rem;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.bp{background:#0d9488;border-color:#0d9488;color:#fff}
.bp:hover{background:#0f766e;color:#fff}
.ct{flex:1;padding:1.3rem;overflow-y:auto;max-width:1100px}
.mapa{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:1.3rem;margin-bottom:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.9rem}
.tc{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:var(--radius);padding:1.1rem;cursor:pointer;transition:.2s}
.tc:hover{border-color:var(--ac)}
.tc h3{font-size:.95rem;color:var(--ac);margin-bottom:.35rem}
.tc p{font-size:.85rem;color:var(--mu);line-height:1.45}
.steps{display:flex;flex-direction:column;gap:.7rem}
.step{display:flex;gap:.85rem;padding:.8rem;background:rgba(255,255,255,.03);border-radius:10px;border-left:4px solid var(--ac)}
.step-num{background:var(--ac);color:#0b1120;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:.9rem}
.list-check{list-style:none}
.list-check li{padding:.35rem 0 .35rem 1.5rem;position:relative;color:var(--mu);line-height:1.5}
.list-check li::before{content:"✓";position:absolute;left:0;color:var(--success);font-weight:bold}
.mantra{background:linear-gradient(90deg,rgba(20,184,166,.12),rgba(251,191,36,.1));border-radius:10px;padding:.9rem 1.1rem;text-align:center;font-weight:600;margin:1.2rem 0;border:1px dashed var(--ac)}
.rb{margin-top:.8rem;padding-top:.8rem;border-top:1px solid var(--bd);font-size:.85rem;color:var(--mu)}
.rb h4{color:var(--ye);margin-bottom:.35rem}
.quiz-card{background:var(--card);border-radius:var(--radius);padding:1.2rem;border:1px solid var(--bd);margin-bottom:1rem}
.quiz-q{font-weight:600;margin-bottom:.8rem;line-height:1.45}
.option{padding:.7rem 1rem;border:2px solid var(--bd);border-radius:9px;cursor:pointer;margin-bottom:.45rem;transition:.15s;font-size:.92rem}
.option:hover{border-color:var(--ac)}
.option.selected{border-color:var(--ac);background:var(--acs)}
.option.correct{border-color:var(--success);background:rgba(34,197,94,.12)}
.option.wrong{border-color:var(--danger);background:rgba(239,68,68,.12)}
.feedback{margin-top:.7rem;padding:.7rem;border-radius:8px;display:none;font-size:.9rem;line-height:1.5}
.feedback.show{display:block}
.feedback.correct{background:rgba(34,197,94,.12);color:var(--success)}
.feedback.wrong{background:rgba(239,68,68,.12);color:var(--danger)}
.ref-line{font-size:.8rem;color:var(--mu);margin-top:.4rem}
.score-box{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;padding:1.2rem;border-radius:var(--radius);text-align:center;margin-bottom:1.2rem}
.score-box h3{font-size:1.9rem}
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.flashcard{perspective:1000px;height:175px}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flashcard.flipped .flash-inner{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;text-align:center;border:1px solid var(--bd)}
.flash-front{background:var(--card)}
.flash-back{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;transform:rotateY(180deg)}
.wel{text-align:center;padding:1.5rem 1rem}
.wel h2{font-size:1.5rem;margin-bottom:.5rem}
.wel p{color:var(--mu);line-height:1.55;margin-bottom:1rem}
.st{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap;margin-top:1.2rem}
.st .n{font-size:1.5rem;font-weight:700;color:var(--ac)}
.st .l{font-size:.75rem;color:var(--mu)}
.mt{display:none;background:0;border:0;color:var(--tx);font-size:1.35rem;cursor:pointer}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
.ov.on{display:block}
.hy{background:rgba(251,191,36,.12);border-left:3px solid var(--ye);padding:.65rem .9rem;margin:.8rem 0;border-radius:0 8px 8px 0;font-size:.9rem}
.body-text{font-size:.95rem;line-height:1.7;color:var(--mu)}
.body-text strong{color:var(--tx)}
.accordion-item{background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:.5rem;border:1px solid var(--bd);overflow:hidden}
.accordion-header{padding:.9rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.accordion-header:hover{background:var(--acs)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 1.1rem;font-size:.92rem;color:var(--mu);line-height:1.6}
.accordion-item.open .accordion-body{max-height:600px;padding-bottom:1rem}
@media(max-width:860px){.side{transform:translateX(-100%)}.side.on{transform:translateX(0)}.mn{margin-left:0}.mt{display:block}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="ov" id="ov"></div>
<aside class="side" id="side">
  <div class="hd">
    <h1>🩺 PenseQuizMed Semiologia</h1>
    <p>Anamnese • Exame • 100 Casos-Quiz • Simulado</p>

</aside>
<div class="mn">

    <div style="display:flex;align-items:center;gap:.55rem">
      <button class="mt" id="mt">☰</button>
      <h2 id="pt">Início</h2>

      <button class="btn" id="themeBtn">🌙</button>

  <main class="ct" id="ct"></main>
</div>

function shuffleArr(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function prepareQuiz(data){
  return shuffleArr(data).map(item=>{
    const idxs=item.options.map((_,i)=>i);
    const shuf=shuffleArr(idxs);
    return {
      q:item.q,
      options:shuf.map(i=>item.options[i]),
      correct:shuf.indexOf(item.correct),
      comment:item.comment,
      ref:item.ref||''
    };
  });
}

const quizState={casos:null,sim:null};

function startOneByOne(kind, rawData){
  const prepared=prepareQuiz(rawData);
  quizState[kind]={
    data:prepared,
    idx:0,
    score:0,
    answered:false
  };
  renderOneQuestion(kind);
}

function renderOneQuestion(kind){
  const st=quizState[kind];
  const boxId=kind==='casos'?'casosBox':'simBox';
  const scoreId=kind==='casos'?'scoreCasos':'scoreSim';
  const textId=kind==='casos'?'scoreCasosText':'scoreSimText';
  const msgId=kind==='casos'?'scoreCasosMsg':'scoreSimMsg';
  const box=document.getElementById(boxId);
  const total=st.data.length;

  if(st.idx>=total){
    const pct=st.score/total;
    document.getElementById(scoreId).style.display='block';
    document.getElementById(textId).textContent=`${st.score} / ${total}`;
    document.getElementById(msgId).textContent=pct>=.8?'Excelente!':pct>=.6?'Bom desempenho – revise os erros.':'Revise os fundamentos de semiologia.';
    box.innerHTML=`<div class="mapa" style="text-align:center">
      <p class="body-text">Quiz finalizado.</p>
      <button class="btn bp" onclick="startOneByOne('${kind}',${kind==='casos'?'CASOS_Q':'SIM_Q'})" style="margin-top:.8rem">Reiniciar (embaralhar de novo)</button>
    </div>`;
    return;
  }

  document.getElementById(scoreId).style.display='none';
  const item=st.data[st.idx];
  const letters=['A','B','C','D','E'];
  st.answered=false;

  box.innerHTML=`<div class="quiz-card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem">
      <div style="color:var(--mu);font-size:.85rem">Questão ${st.idx+1} de ${total} · Acertos: ${st.score}</div>
      <button class="btn" type="button" onclick="startOneByOne('${kind}',${kind==='casos'?'CASOS_Q':'SIM_Q'})">↺ Reiniciar quiz</button>
    </div>
    <div class="quiz-q">${item.q}</div>
    ${item.options.map((opt,j)=>`<div class="option" data-opt="${j}">${letters[j]||(j+1)}) ${opt}</div>`).join('')}
    <div class="feedback" id="fb-one-${kind}"></div>
    <div style="text-align:center;margin-top:1rem">
      <button class="btn bp" id="btnNext-${kind}" style="display:none" onclick="nextQuestion('${kind}')">Próxima →</button>
    </div>
  </div>`;

  box.querySelectorAll('.option').forEach(opt=>{
    opt.addEventListener('click',()=>{
      if(st.answered) return;
      st.answered=true;
      const chosen=+opt.dataset.opt;
      const opts=box.querySelectorAll('.option');
      opts.forEach(o=>{
        o.style.pointerEvents='none';
        if(+o.dataset.opt===item.correct) o.classList.add('correct');
      });
      const fb=document.getElementById(`fb-one-${kind}`);
      if(chosen===item.correct){
        st.score++;
        opt.classList.add('selected','correct');
        fb.className='feedback show correct';
        fb.innerHTML=`✓ Correto! ${item.comment}<div class="ref-line">📖 ${item.ref}</div>`;
      } else {
        opt.classList.add('selected','wrong');
        fb.className='feedback show wrong';
        fb.innerHTML=`✗ Incorreto. ${item.comment}<div class="ref-line">📖 ${item.ref}</div>`;
      }
      const btn=document.getElementById(`btnNext-${kind}`);
      btn.style.display='inline-block';
      btn.textContent=st.idx+1>=total?'Ver resultado':'Próxima →';
    });
  });
}

function nextQuestion(kind){
  quizState[kind].idx++;
  renderOneQuestion(kind);
}
